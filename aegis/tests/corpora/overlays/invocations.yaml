# Explicit, reviewed contract invocations for corpus rows whose surface is not a plain prompt.
# Corpus rows stay byte-identical to staging; this overlay carries the CONTRACTS shape
# (Interaction kind/surface/tool_name/tool_args, CONTRACTS §3.1 + Addendum A-13).
#
# Placeholders: "$text" = the row text verbatim.
# kind/surface:   tool_call + tool.input  -> Claude Code style built-in tool (Bash/Read/Write/WebFetch)
#                 mcp + mcp.call          -> MCP tools/call  (tool_name "<server>.<tool>")
#                 mcp + mcp.list          -> one tool definition from tools/list (raw + description segment)
#                 model_call + model.response -> assistant output (handled by the adapter default)
# MCP servers are the seeded ones from config/policy.yaml (`mcp.servers`) so MCP-01 never blocks
# on "unknown server" and the description text alone decides. Tool-description rows all use the
# third-party `web` server (benign twins too), so the server is never the signal.

# ------------------------------------------------------------------ built-in tools (tool.input)
AGT-CMD-001: {kind: tool_call, surface: tool.input, tool_name: Bash, tool_args: {command: $text}}
