# Budgets: token/cost limits, local compute
# Case schema: tests/cases/README.md. One YAML item = one test; append a line and re-run `make test`.
# Seeded from staging/seed/policy.yaml examples by tests/lib/seed_import.py (see `source:`), then curated.
# Fake/test data only; secret-shaped values come from {{gen:*}} macros at run time.
cases:
  - {"id": "BUD01-SESSION-USD-EXHAUSTED", "control": "BUD-01", "polarity": "attack", "expect": "block", "as": "selftest-zero", "model": "mock-echo", "dest": "remote", "input": "Write 2,000 words about bond convexity.", "note": "agent:selftest-zero has a usd 0 day limit in the golden policy (self-test fixture), so its hard limit is already exhausted; staging expected HTTP 402 with a mock_usage field", "source": "staging/seed/policy.yaml#BUD-01/session-usd-exhausted"}
  - {"id": "BUD01-CLAMP-MAX-TOKENS", "control": "BUD-01", "polarity": "benign", "expect": "allow", "via": "anthropic", "model": "mock-echo", "max_tokens": 100000, "input": "Write a haiku about risk limits.", "as": "trading-copilot@trading", "assert": {"upstream_must_contain": ["\"max_tokens\": 4096"], "upstream_must_not_contain": ["\"max_tokens\": 100000"]}, "note": "the request is served (allow) but max_tokens above budgets.defaults.max_output_tokens is clamped to 4096 before the upstream call; asserted on the upstream body (staging expected a redact verdict)", "source": "staging/seed/policy.yaml#BUD-01/clamp-max-tokens"}
  - {"id": "BUD01-SMALL-REQUEST", "control": "BUD-01", "polarity": "benign", "expect": "allow", "input": "Give me a one-line summary of today's PKO move.", "as": "trading-copilot@trading", "source": "staging/seed/policy.yaml#BUD-01/small-request"}
  - {"id": "BUD02-MODEL-TOO-BIG", "control": "BUD-02", "polarity": "attack", "expect": "block", "surface": "model.admin", "tool": "ollama.pull", "args": {"model": "llama3.1:70b"}, "dest": "local", "as": "research-agent@research", "note": "70b x 0.65 GB/B = ~45 GB > max_model_gb 3", "source": "staging/seed/policy.yaml#BUD-02/model-too-big"}
  - {"id": "BUD02-SESSION-COMPUTE-EXHAUSTED", "control": ["BUD-02", "BUD-01"], "polarity": "attack", "expect": "block", "as": "research-agent@research", "model": "qwen3.5:0.8b", "dest": "local", "steps": [{"input": "Summarise filing", "usage": {"compute_s": 650}}, {"input": "And the next one"}], "note": "the first call reports 650 compute-seconds via /v1/guard/complete, past the research-agent session cap (compute_s 600); compute-second limits are ledger dimensions checked by BUD-01, BUD-02 owns slots and model size", "source": "staging/seed/policy.yaml#BUD-02/session-compute-exhausted"}
  - {"id": "BUD02-SHORT-LOCAL-INFERENCE", "control": "BUD-02", "polarity": "benign", "expect": "allow", "input": "Summarise in one sentence: banks rallied.", "as": "research-agent@research", "model": "qwen3.5:0.8b", "dest": "local", "source": "staging/seed/policy.yaml#BUD-02/short-local-inference"}
  - {id: BUD02-SMALL-MODEL-PULL-ALLOWED, control: BUD-02, polarity: benign, expect: allow, surface: model.admin, tool: ollama.pull, args: {model: "qwen3:0.6b"}, dest: local, as: research-agent@research, note: "0.6b x 0.65 GB/B fits under max_model_gb 3"}
