mcp:
  servers:                              # all served by mocks/mock_mcp on :8792 in the demo
    acme-db:     {transport: http, url: "http://127.0.0.1:8792/mcp/acme-db",     destination: local,       description: "Mock Postgres: acme-prod-pg / acme-staging-pg"}
    acme-crm:    {transport: http, url: "http://127.0.0.1:8792/mcp/acme-crm",    destination: local,       description: "Mock CRM"}
    marketpulse: {transport: http, url: "http://127.0.0.1:8792/mcp/marketpulse", destination: third_party, description: "Market-data SaaS (simulates api.marketpulse.example)"}
    payments:    {transport: http, url: "http://127.0.0.1:8792/mcp/payments",    destination: third_party, description: "Payments ($12 / $480 / $1,500 spend flows)"}
    mailer:      {transport: http, url: "http://127.0.0.1:8792/mcp/mailer",      destination: third_party, description: "Outbound email"}
    web:         {transport: http, url: "http://127.0.0.1:8792/mcp/web",         destination: third_party, description: "Canned web pages (indirect injection demo)"}
    weather:     {transport: http, url: "http://127.0.0.1:8792/mcp/weather",     destination: third_party, description: "Benign demo tools"}
    poisoned:    {transport: http, url: "http://127.0.0.1:8792/mcp/poisoned",    destination: third_party, description: "Demo: tool poisoning + shadowing"}
    rugpull:     {transport: http, url: "http://127.0.0.1:8792/mcp/rugpull",     destination: third_party, description: "Demo: benign until POST :8792/_mock/rugpull/flip"}
    poisoned-stdio: {transport: stdio, command: [python, "-m", mocks.mock_mcp, "--stdio", poisoned], destination: third_party, description: "stdio demo via python -m aegis.mcp.stdio"}
  unknown_server_action: block
  on_tool_change: block
  max_description_len: 1024

feeds:
  sources: [{id: aegis-threat-intel, url: "http://127.0.0.1:8790", pubkey_file: config/feeds/feed_pubkey.b64, seed_bundle: config/feeds/seed_bundle.json, poll_s: 10, sse: true, enabled: true, max_age_s: 86400}]
  overrides:
    AEGIS-TI-013: {action: redact, justification: "Strip invisible Unicode instead of blocking (copy-paste from PDFs)"}

controls:
  # ======================================================================= GOV
  - id: GOV-01
    name: Caller identity & attribution
    action: log                         # Addendum A-17: anonymous -> allow; unknown agent id -> log; bad/revoked/expired key, spoofing, disabled principal -> block
    severity: high
    owasp: [ASI03, ASI07, MCP07:2025, LLM03:2026]
    params: {anonymous_action: allow, unknown_agent_action: log, invalid_key_action: block, disabled_principal_action: block, principal_mismatch_action: block, require_auth: null, require_auth_sources: [proxy, mcp, hook, egress, guard], enforce_key_scopes: false, exempt_agents: [selftest]}
    fail_mode: closed
    timeout_ms: 50
    tests:
      - {name: disabled-agent-blocked, agent: legacy-bot@platform, destination: remote, text: "hello", expect: block, control: GOV-01}
      - {name: valid-agent, agent: trading-copilot@trading, destination: remote, text: "Summarize today's PKO BP price action.", expect: allow, control: GOV-01}

  - id: GOV-02
    name: Model allowlist & destination tiering
    action: block
    severity: high
    owasp: [LLM03:2026, LLM06:2026, LLM02:2026, ASI10]
    fail_mode: closed
    timeout_ms: 50
    params: {enforce_policy_allowlist: true, enforce_agent_allowlist: true, enforce_tier_ceiling: true, on_tier_violation: block, reroute_model: null}
    # params.reroute_on_class (profiles): permissive {} | balanced {} | strict {RESTRICTED: local}
    #   | paranoid {RESTRICTED: local, CONFIDENTIAL: local}  (route mutation to the local model)
    tests:
      - {name: local-agent-to-remote, agent: research-agent@research, destination: remote, text: "hi", expect: block, control: GOV-02, model: claude-sonnet-4-5}
      - {name: local-agent-local-model, agent: research-agent@research, destination: local, text: "hi", expect: allow, control: GOV-02, model: aegis-judge}

  - id: GOV-03
    name: Tool authorization (RBAC + arg constraints)
    action: block
    severity: high
    owasp: [LLM03:2026, ASI02, ASI03, MCP02:2025]
    params: {deny_tools: [], arg_rules: {}, check_action_types: true}
    timeout_ms: 100
    tests:
      - {name: research-agent-cannot-email, kind: mcp, surface: mcp.call, destination: third_party, tool_name: mailer.send_email,
         tool_args: {to: "ops@acme-capital.example", subject: "notes", body: "weekly notes"}, agent: research-agent@research, expect: block, control: GOV-03}
      - name: copilot-cannot-execute-trades
        kind: tool_call
        surface: tool.input
        destination: local
        tool_name: trade.execute
        tool_args: {ticker: CDR, qty: 100}
        agent: trading-copilot@trading
        expect: block
        control: GOV-03
      - {name: research-agent-may-buy-dataset, kind: mcp, surface: mcp.call, destination: third_party, tool_name: payments.create_charge,   # [SF-02]
         tool_args: {vendor: opendata-shop, plan: eu-equities-2025-csv, amount_usd: 12, currency: USD}, agent: research-agent@research, expect: allow, control: GOV-03}
      - name: claude-code-may-read
        kind: tool_call
        surface: tool.input
        destination: local
        tool_name: Read
        tool_args: {file_path: "/tmp/aegis-demo/project/README.md"}
        agent: claude-code@platform
        expect: allow
        control: GOV-03
      - {name: claude-code-may-call-payments, kind: mcp, surface: mcp.call, destination: third_party, tool_name: payments.create_charge,     # [SF-02]
         tool_args: {vendor: gpucloud, plan: a100-24h-reservation, amount_usd: 480, currency: USD}, agent: claude-code@platform, expect: allow, control: GOV-03}

  - id: GOV-04
    name: Human approval gate for other high-impact tools
    action: require_approval
    severity: high
    owasp: [ASI09, ASI02, LLM03:2026]
    params: {approve_tools: ["*.delete_*", "*.drop_*", "acme-crm.export_*"], max_pending_per_agent: 3, flood_check: true}
    timeout_ms: 100
    tests:
      - {name: delete-customer-needs-approval, kind: mcp, surface: mcp.call, destination: local, tool_name: acme-crm.delete_customer,
         tool_args: {customer_id: "C-1001"}, agent: chaos-agent@platform, expect: require_approval, control: GOV-04}
      - name: weather-allowed
        kind: mcp
        surface: mcp.call
        destination: third_party
        tool_name: weather.get_weather
        tool_args: {city: Warsaw}
        agent: chaos-agent@platform
        expect: allow
        control: GOV-04

  - id: GOV-05
    name: Config-change governance (who may change what)
    action: require_approval
    severity: high
    fail_mode: closed
    owasp: [ASI03, ASI09]
    params: {allow_if_proposer_satisfies: true, agent_proposals: require_approval, title_template: "{actor} wants to {summary}"}
    tests:                              # need PolicyTest extras `member` + `changes` (Addendum A-29)
      - {name: member-raises-team-budget, kind: config_change, surface: config.change, destination: local, member: u_piotr, expect: require_approval, control: GOV-05,
         changes: [{kind: budget.raise, path: "budgets.limits[scope=team:trading,window=day].usd", scope: "team:trading", dimension: usd, before: 60, after: 75, increase_pct: 25, loosening: true}]}
      - {name: owner-raises-team-budget, kind: config_change, surface: config.change, destination: local, member: u_katarzyna, expect: allow,
         changes: [{kind: budget.raise, path: "budgets.limits[scope=team:trading,window=day].usd", scope: "team:trading", dimension: usd, before: 60, after: 150, increase_pct: 150, loosening: true}]}
      - {name: admin-disables-critical-control, kind: config_change, surface: config.change, destination: local, member: u_marek, expect: require_approval, control: GOV-05,
         changes: [{kind: control.disable, path: "controls[id=DLP-02].enabled", control_id: DLP-02, before: true, after: false, loosening: true}]}

  - id: GOV-06                          # [SF-26] Addendum A-47; owner claude-code-integration (src/aegis/integrations/claude_code/)
    name: Agent harness integrity (Claude Code)
    action: block
    severity: high
    owasp: [ASI03, ASI10, LLM06:2026]
    enabled: true
    mode: enforce
    params:
      agents: ["claude-code@*"]
      protected_paths: ["**/demo/claude/settings*.json", "**/demo/claude/mcp.json", "**/demo/claude/.agent_key", "**/.claude/settings*.json", "**/scripts/aegis-hook"]
      config_change_keys: ["hooks", "env.ANTHROPIC_BASE_URL", "env.ANTHROPIC_CUSTOM_HEADERS", "permissions.defaultMode", "disableAllHooks"]
      # block_bypass_permissions (profiles): false | false | true (strict) | true (paranoid)
      budget_exhausted_prompt: block
      pass_decision: none
      approval_surface: deny_link
      max_hold_s: 90
      config_change_guard: guard_keys
      scan_routed_mcp_results: false
      internal_error: deny
    tests:
      - {name: edit-hook-settings-blocked, kind: tool_call, surface: tool.input, destination: local, tool_name: Edit,
         tool_args: {file_path: "/tmp/aegis-demo/demo/claude/settings.json", old_string: "aegis-hook", new_string: "true"}, agent: claude-code@platform, expect: block, control: GOV-06}
      - name: bash-disable-hook-blocked
        kind: tool_call
        surface: tool.input
        destination: local
        tool_name: Bash
        tool_args: {command: "chmod -x /tmp/aegis-demo/scripts/aegis-hook"}
        agent: claude-code@platform
        expect: block
        control: GOV-06
      - name: edit-source-file-allowed
        kind: tool_call
        surface: tool.input
        destination: local
        tool_name: Edit
        tool_args: {file_path: "/tmp/aegis-demo/demo/claude/project/src/payments/refunds.py", old_string: a, new_string: b}
        agent: claude-code@platform
        expect: allow
        control: GOV-06

  # ======================================================================= ACT
  - id: ACT-01
    name: Spend guard (purchases, subscriptions, top-ups)
    action: require_approval
    severity: high
    owasp: [LLM03:2026, ASI02, ASI09, LLM06:2026]
    timeout_ms: 100
    # auto_allow_max_usd / hard_block_above_usd (profiles): permissive 5 / 10000 | balanced 0 / 5000
    #   | strict 0 / 1000 | paranoid 0 / 500. Above the hard cap a purchase is blocked, never approvable.
    params: {fx_to_usd: {USD: 1.0, PLN: 0.25, EUR: 1.08, GBP: 1.27}, missing_amount: route_as_max,
             unapproved_vendor: require_approval, price_check: true}
    tests:
      - {name: saas-50-admin, kind: mcp, surface: mcp.call, destination: third_party, tool_name: marketpulse.purchase_subscription,
         tool_args: {vendor: marketpulse, plan: mp-pro-monthly, amount_usd: 50}, agent: trading-copilot@trading, expect: require_approval, control: ACT-01}
      - name: understated-plan-price
        kind: mcp
        surface: mcp.call
        destination: third_party
        tool_name: marketpulse.purchase_subscription
        tool_args: {vendor: marketpulse, plan: mp-enterprise-annual, amount_usd: 5}
        agent: trading-copilot@trading
        expect: require_approval
        control: ACT-01
      - {name: over-hard-cap, kind: mcp, surface: mcp.call, destination: third_party, tool_name: payments.create_charge,
         tool_args: {vendor: gpucloud, amount_usd: 5000.01, currency: USD}, agent: chaos-agent@platform, expect: block, control: ACT-01}
      - name: pln-converted
        kind: mcp
        surface: mcp.call
        destination: third_party
        tool_name: payments.create_charge
        tool_args: {vendor: opendata-shop, amount: 400, currency: PLN}
        agent: chaos-agent@platform
        expect: require_approval
        control: ACT-01
      - {name: list-plans-no-spend, kind: mcp, surface: mcp.call, destination: third_party, tool_name: marketpulse.list_plans,
         tool_args: {}, agent: trading-copilot@trading, expect: allow, control: ACT-01}

  - id: ACT-02
    name: Data access guard (tables by sensitivity & environment)
    action: require_approval
    severity: high
    owasp: [LLM02:2026, LLM03:2026, ASI02, ASI03, MCP02:2025]
    params: {auto_allow_max_sensitivity: PUBLIC, auto_allow_max_rows: 1, unknown_table_sensitivity: CONFIDENTIAL, aggregate_max_sensitivity: INTERNAL, block_statements_in_prod: [DROP, TRUNCATE, ALTER, GRANT, REVOKE, RENAME, CREATE], restricted_action: block, server_databases: {acme-db: acme-prod-pg}, tables: {}}
    timeout_ms: 100
    tests:
      - {name: select-customers-needs-approval, kind: mcp, surface: mcp.call, destination: local, tool_name: acme-db.query,
         tool_args: {sql: "SELECT * FROM customers"}, agent: trading-copilot@trading, expect: require_approval, control: ACT-02}
      - {name: payment-cards-blocked, kind: mcp, surface: mcp.call, destination: local, tool_name: acme-db.query,
         tool_args: {sql: "SELECT pan FROM payment_cards"}, agent: trading-copilot@trading, expect: block, control: ACT-02}
      - name: delete-trades-needs-owner
        kind: mcp
        surface: mcp.call
        destination: local
        tool_name: acme-db.query
        tool_args: {sql: "DELETE FROM trades"}
        agent: chaos-agent@platform
        expect: require_approval
        control: ACT-02
      - name: drop-table-blocked
        kind: mcp
        surface: mcp.call
        destination: local
        tool_name: acme-db.query
        tool_args: {sql: "DROP TABLE trades"}
        agent: chaos-agent@platform
        expect: block
      - name: stacked-ddl-blocked
        kind: mcp
        surface: mcp.call
        destination: local
        tool_name: acme-db.query
        tool_args: {sql: "SELECT close FROM market_prices; DROP TABLE trades"}
        agent: chaos-agent@platform
        expect: block
      - name: research-grant-read
        kind: mcp
        surface: mcp.call
        destination: local
        tool_name: acme-db.query
        tool_args: {sql: "SELECT title, summary FROM research_notes LIMIT 20"}
        agent: research-agent@research
        expect: allow
        control: ACT-02
      - {name: market-prices-allowed, kind: mcp, surface: mcp.call, destination: local, tool_name: acme-db.query,
         tool_args: {sql: "SELECT close FROM market_prices WHERE ticker = 'CDR'"}, agent: trading-copilot@trading, expect: allow, control: ACT-02}

  - id: ACT-03
    name: External send guard (email, webhooks, uploads)
    action: require_approval
    severity: high
    owasp: [LLM02:2026, ASI01, ASI02, MCP10:2025]
    params: {max_recipients: 10, denylisted_hosts_action: block, deny_recipients: [], block_data_classes: [RESTRICTED, SECRET]}
    timeout_ms: 100
    tests:
      - {name: external-email-needs-approval, kind: mcp, surface: mcp.call, destination: third_party, tool_name: mailer.send_email,
         tool_args: {to: "client@client-portal.example", subject: "Weekly note", body: "Markets were calm this week."}, agent: trading-copilot@trading, expect: require_approval, control: ACT-03, assert: control}
      - name: placeholder-pii-external
        kind: mcp
        surface: mcp.call
        destination: third_party
        tool_name: mailer.send_email
        tool_args: {to: client@client-portal.example, subject: Account, body: "Summary for [PERSON_1]"}
        agent: trading-copilot@trading
        expect: require_approval
        control: ACT-03
        assert: control
      - {name: internal-email-allowed, kind: mcp, surface: mcp.call, destination: third_party, tool_name: mailer.send_email,             # [SF-07]
         tool_args: {to: "ops@acme-capital.example", subject: "Weekly note", body: "Markets were calm this week."}, agent: trading-copilot@trading, expect: allow, control: ACT-03, assert: control}

  - id: ACT-04
    name: Code execution & deploy guard
    action: require_approval
    severity: high
    owasp: [ASI05, LLM10:2026, MCP05:2025]
    params: {category_actions: {code.deploy: require_approval, code.exec: require_approval, package.install: log}, protected_branches: [main, master, release/*, prod, production], feature_branch_push: allow}   # SIG-03 owns unknown packages
    timeout_ms: 100
    tests:
      - {name: terraform-apply-needs-approval, kind: tool_call, surface: tool.input, destination: local, tool_name: Bash,
         tool_args: {command: "terraform apply -auto-approve -var-file=prod.tfvars"}, agent: claude-code@platform, expect: require_approval, control: ACT-04}
      - name: force-push-main-needs-approval
        kind: tool_call
        surface: tool.input
        destination: local
        tool_name: Bash
        tool_args: {command: "git push --force origin main"}
        agent: claude-code@platform
        expect: require_approval
        control: ACT-04
      - name: feature-push-allowed
        kind: tool_call
        surface: tool.input
        destination: local
        tool_name: Bash
        tool_args: {command: "git push origin feature/x"}
        agent: claude-code@platform
        expect: allow
        control: ACT-04
      - {name: pytest-allowed, kind: tool_call, surface: tool.input, destination: local, tool_name: Bash,
         tool_args: {command: "pytest -q"}, agent: claude-code@platform, expect: allow, control: ACT-04}

  # ======================================================================= DLP
  - id: DLP-01
    name: PII/PCI/Polish-ID tokenization (destination matrix)
    action: redact
    severity: high
    owasp: [LLM02:2026, MCP10:2025, ASI03]
    fail_mode: closed
    timeout_ms: 2000
    params:
      # redaction_ratio_block (profiles): 0.9 | 0.6 | 0.4 | 0.3  - block instead of redact when more than
      #   this share of the text would be placeholders. matrix_overrides (strict / paranoid) tighten
      #   destinations.matrix cells, e.g. {RESTRICTED: {remote: block}, CONFIDENTIAL: {third_party: block}}
      mask_style: placeholder
      allowlist_values: []
      entities: [EMAIL, PHONE, DOB, PESEL, NIP, REGON, PL_ID_CARD, PASSPORT, IBAN, PAN, CARD_EXPIRY, CVV, TRACK_DATA, CRYPTO_ADDRESS]
      min_scores: {NIP: 0.6, REGON: 0.7, PL_ID_CARD: 0.7, PASSPORT: 0.7}
      force_block: [TRACK_DATA]
      ratio_min_chars: 200
      ratio_roles: [user, tool_args]
      max_entities_per_request: 200
      known_values: true
      cross_segment: true
      phone_regions: [PL, GB, US, DE]
      email_reserved_tlds: [example, test]
      decode_depth: 2
      allow_patterns: []
      routing_args:                     # [SF-04] recipient args are routing data (governed by ACT-03): findings logged, never redacted/blocked
        "mailer.*": [to, cc, bcc]
        "*.send_email": [to, cc, bcc]
        "*.send_*": [to, cc, bcc, recipient, recipients]
    tests:
      - {name: pesel-to-remote, text: "Klient Jan, PESEL 44051401359", destination: remote, expect: redact, control: DLP-01}
      - {name: invalid-pesel, text: "Zamowienie 44051401358 wyslane", destination: remote, expect: allow}
      - name: client-pii-to-remote
        destination: remote
        expect: redact
        control: DLP-01
        text: "Please draft a reply confirming the refund to IBAN PL61 1090 1014 0000 0712 1981 2874. His PESEL is 44051401359 and the card on file is 4111 1111 1111 1111 exp 12/27, CVV 123."
      - name: card-to-local-tokenized
        destination: local
        text: "Refund card 4111 1111 1111 1111 please"
        expect: redact
