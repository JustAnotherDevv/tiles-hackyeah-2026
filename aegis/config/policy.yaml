    - {name: strict-delete-trades-prod-two-person, profile: strict, request: {kind: action, action_type: db.write, requester: trading-copilot@trading, resource: "db:trades", labels: {sensitivity: CONFIDENTIAL, env: prod, bulk: "true"}},
       expect: {required_role: owner, two_person: true, rule: db-prod-bulk-delete-strict}}
    - {name: f4-external-email-public-self, request: {kind: action, action_type: email.external, requester: trading-copilot@trading, resource: "host:client-portal.example", labels: {data_class: PUBLIC}},
       expect: {required_role: self, rule: external-send, approvers_ok: [u_piotr], approvers_not_ok: [u_olivia]}}
    - {name: f5-team-day-raise-25pct-admin, request: {kind: config_change, requester: u_piotr, changes: [{kind: budget.raise, path: "budgets.limits[scope=team:trading,window=day].usd", scope: "team:trading", dimension: usd, before: 60, after: 75, increase_pct: 25, loosening: true}]},
       expect: {required_role: admin, rule: raise-team-small, gov05: require_approval, approvers_ok: [u_emily], approvers_not_ok: [u_piotr]}}
    - {name: f5-team-day-raise-150pct-owner, request: {kind: config_change, requester: u_piotr, changes: [{kind: budget.raise, path: "budgets.limits[scope=team:trading,window=day].usd", scope: "team:trading", dimension: usd, before: 60, after: 150, increase_pct: 150, loosening: true}]},
       expect: {required_role: owner, rule: raise-large, gov05: require_approval, approvers_ok: [u_katarzyna], approvers_not_ok: [u_emily, u_marek, u_piotr]}}
    - {name: f5-admin-disables-dlp02-needs-owner, request: {kind: config_change, requester: u_marek, changes: [{kind: control.disable, path: "controls[id=DLP-02].enabled", control_id: DLP-02, before: true, after: false, loosening: true}]},
       expect: {required_role: owner, rule: disable-control-critical, gov05: require_approval, approvers_ok: [u_katarzyna], approvers_not_ok: [u_marek, u_emily]}}
    - {name: f5-owner-edits-apply-directly, request: {kind: config_change, requester: u_katarzyna, changes: [{kind: control.disable, path: "controls[id=DLP-02].enabled", control_id: DLP-02, before: true, after: false, loosening: true}]},
       expect: {required_role: owner, rule: disable-control-critical, gov05: allow}}
    - {name: f6-budget-override-admin, request: {kind: budget_raise, action_type: budget.override, requester: chaos-agent@platform, labels: {scope: "agent:chaos-agent@platform", scope_type: agent, dimension: usd}},
       expect: {required_role: admin, rule: budget-override, approvers_ok: [u_marek, u_emily, u_katarzyna], approvers_not_ok: [u_tomasz, chaos-agent@platform]}}
    - {name: f6-sponsor-kills-own-agent-auto, request: {kind: config_change, requester: u_tomasz, changes: [{kind: killswitch.on, path: "budgets.kill_switch.agents", scope: "agent:chaos-agent@platform", before: [], after: ["chaos-agent@platform"], loosening: false}]},
       expect: {required_role: auto, rule: killswitch-own-agent, gov05: allow}}
    - {name: member-global-kill-needs-admin, request: {kind: config_change, requester: u_tomasz, changes: [{kind: killswitch.on, path: "budgets.kill_switch.global", scope: global, before: false, after: true, loosening: false}]},
       expect: {required_role: admin, rule: tighten, gov05: require_approval}}
    - {name: global-kill-release-owner, request: {kind: config_change, requester: u_marek, changes: [{kind: killswitch.off, path: "budgets.kill_switch.global", scope: global, before: true, after: false, loosening: true}]},
       expect: {required_role: owner, rule: killswitch-release-global}}
    - {name: f9-rugpull-repin-admin, request: {kind: mcp_pin, action_type: mcp.repin, requester: claude-code@platform, resource: "mcp:rugpull.get_exchange_rate", labels: {dest: third_party, server: rugpull, reason: changed}},
       expect: {required_role: admin, rule: mcp-repin, approvers_ok: [u_marek], approvers_not_ok: [u_tomasz]}}
    - {name: org-promote-to-admin-needs-owner, request: {kind: action, action_type: org.role.promote_admin, requester: u_marek, resource: "member:u_piotr", labels: {category: org, to_role: admin}},
       expect: {required_role: owner, rule: org-privileged, approvers_ok: [u_katarzyna], approvers_not_ok: [u_marek, u_emily, u_piotr]}}
    - {name: org-member-update-admin, request: {kind: action, action_type: org.member.update, requester: u_marek, resource: "member:u_olivia", labels: {category: org}},
       expect: {required_role: admin, rule: org-routine}}
    - {name: gov04-generic-tool-admin, request: {kind: action, action_type: "tool:acme-crm.delete_customer", requester: chaos-agent@platform},
       expect: {required_role: admin, rule: tool-approve, approvers_not_ok: [u_tomasz]}}
    - {name: unknown-db-sensitivity-fails-closed, request: {kind: action, action_type: db.read, requester: claude-code@platform, resource: "db:mystery_table"},
       expect: {required_role: admin, rule: null}}
