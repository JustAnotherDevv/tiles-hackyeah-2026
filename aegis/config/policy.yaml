# =============================================================================
#  Aegis - control catalog (config/policy.yaml)                    Acme Capital
# =============================================================================
#
#  ONE SOURCE OF TRUTH
#    Every hop Aegis governs - agent->model, model->agent, agent->tool (built-in
#    and MCP), tool->agent, MCP lifecycle, third-party HTTP egress, agent actions
#    (spend, data access, external send, code exec, deploy) and policy changes
#    themselves - is decided by the controls in this file. It is meant to be read
#    by humans (judges, security teams) as much as by the gateway.
#
#  HOT RELOAD (target < 1 s)
#    save -> parse (line/col errors) -> schema + semantic checks -> profile merge
#    -> SELF-TEST GATE (inline `tests:` below) -> atomic swap -> new version in
#    /api/policy/history, audit `policy.applied`, dashboard toast.
#    ANY failure keeps the last-known-good version serving traffic and shows
#    "Rejected: still on vN, line X col Y: ...". Every decision is stamped with
#    the policy version that made it.
#
#  FILE LAYOUT
#    version / metadata / profile .. identity + THE strictness switch
#    defaults ...................... gateway-wide switches (monitor-only mode, fail mode)
#    destinations .................. data class x destination matrix, internal domains
#    providers / models ............ upstreams, model allow/deny, routes, downgrade ladder
#    budgets ....................... token/cost/compute/spend limits, loops, kill switch
#    actions ....................... how tool calls are classified (spend.*, db.*, ...)
#    approvals ..................... WHO approves WHAT (first match wins)
#    mcp / feeds ................... MCP server registry, signed threat-feed overrides
#    controls ...................... the control catalog (37 controls + 2 reserved)
#    tests ......................... pipeline-level golden tests
#
#  HOW EFFECTIVE SETTINGS ARE COMPUTED (read this before editing live)
#    profile: permissive | balanced | strict | paranoid  -> config/profiles/<p>.yaml
#    For each control, lowest to highest precedence:
#      1. built-in defaults (+ the catalog's default action)
#      2. profile kind_defaults (deterministic / semantic / hybrid / stateful)
#      3. defaults.fail_mode / defaults.semantic_timeout_ms when set here
#      4. profile per-control values (thresholds, params, actions)
#      5. what you write in the control entry below (params/scope merge key by
#         key; other fields replace). Knobs that vary by profile are NOT pinned
#         below - the comment next to the control shows the per-profile values.
#      6. strict / paranoid are a FLOOR: a pinned knob can only be stricter
#         (threshold = min, adherence_pct = max, action / fail_mode = stricter).
#         `enabled` and `mode` are never floored - you can always switch off.
#      7. defaults.mode: monitor puts EVERY control in shadow mode ("would block").
#
#  ACTIONS (most restrictive wins):  block > require_approval > redact > log > allow
#    redact covers tokenize / mask / quarantine / strip tool / clamp / downgrade.
#  MODES        enforce | monitor (shadow: decision logged as "would <action>",
#               traffic untouched) | off (= enabled: false)
#  FAIL MODES   closed (detector error -> block) | open (-> allow, marked degraded)
#               | deterministic_only (semantic leg skipped, deterministic still decides)
#  THRESHOLDS   threshold: 0-1 score at/above which the action applies (LOWER =
#               stricter, 0.90 = 90 %). adherence_pct: 0-100 minimum topic
#               adherence (HIGHER = stricter).
#
#  INLINE TESTS = THE SELF-TEST GATE
#    `tests:` under a control are attributed to it (only THAT control's verdict is
#    compared, so disabling some other control never breaks them). A save that
#    makes a must-protect test (redact / require_approval / block) LOOSER than
#    expected is rejected - update the test, or loosen properly with
#    `mode: monitor` / `enabled: false`. Tests of disabled controls are skipped.
#    Semantic (model) tests run right after the swap and only warn.
#    Macros (expanded at run time, so no secret-shaped strings live in git):
#      {{gen:aws_access_key_id}} {{gen:github_pat}} {{gen:jwt}} {{gen:slack_token}}
#      {{b64:TEXT}} {{b64url:TEXT}} {{tags:TEXT}} (invisible tag chars) {{zw:TEXT}}
#    Test data is fictional / published test data: PESEL 44051401359, IBAN
#    PL61 1090 1014 0000 0712 1981 2874, card 4111 1111 1111 1111, AWS docs key.
#
#  WHO MAY CHANGE THIS FILE
#    Saving this file on disk = owner break-glass: applied without approval,
#    audited as source=file. Dashboard edits / budget raises / kill switches go
#    through `approvals.config_rules` (GOV-05): e.g. a member raising a team
#    budget +25 % needs an admin; disabling a critical control needs the owner.
#
#  TRY THIS LIVE (each takes effect within ~1 s of saving)
#    * profile: balanced -> strict                     (everything tightens)
#    * defaults.mode: enforce -> monitor               (shadow mode, nothing blocked)
#    * controls[id=DLP-02]: add `enabled: false`       (secrets now pass; audited)
#    * controls[id=INJ-02].threshold: 0.80 -> 0.50     (borderline prompts flip to block)
#    * destinations.matrix.CONFIDENTIAL.remote: redact -> block
#    * budgets.limits team:research day usd: 15 -> 0.01 (next research call -> 402)
#    * budgets.kill_switch.agents: [chaos-agent@platform]
#    * controls[id=CUS-01].params.rules[0].keywords: add your own code name
#    * models.denied: add "claude-opus-*"
#    * defaults.selftest_gate: enforce -> warn         (self-test failures only warn)
#    * break the YAML on purpose (delete a colon): rejected with line/col,
#      traffic keeps flowing on the last good version
#
#  Corrected seed: docs/seed-fixes/policy.yaml (synth-A); fix codes [SF-NN] are
#  explained in docs/CONTRACTS.md Addendum A.
# =============================================================================

version: 1
metadata:
  name: acme-capital-default
  description: "Default control catalog for Acme Capital (demo)"
  owner: u_marek
profile: balanced                       # permissive | balanced | strict | paranoid (config/profiles/*.yaml)

defaults:
  mode: enforce
  fail_mode: closed
  semantic_timeout_ms: 400
  stream_mode: buffered
  block_response: message               # model proxies answer with a synthetic "[Aegis] Blocked by ..." reply
  require_auth: false                   # demo: identity may come from X-Aegis-* headers
  audit_content: false
  rehydrate_responses: true
  max_body_bytes: 8000000
  selftest_gate: enforce                # extra (Addendum A-28): enforce | warn | off

destinations:
  matrix:                               # data class x destination -> action (DLP-01/02/03/07); judges edit cells live
    PUBLIC:       {local: allow,  remote: allow,  third_party: allow}
    INTERNAL:     {local: allow,  remote: redact, third_party: redact}   # acted on by DLP-03 (metadata-egress)
    CONFIDENTIAL: {local: allow,  remote: redact, third_party: redact}   # [SF-04] tokenize, don't block (strict profile: block)
    RESTRICTED:   {local: redact, remote: redact, third_party: block}    # PAN to WebFetch / a third-party tool -> block
    SECRET:       {local: log,    remote: block,  third_party: block}
  local_tools: [Read, Write, Edit, MultiEdit, Glob, Grep, LS, NotebookEdit, Bash, TodoWrite, BashOutput, KillShell, Task, Skill]
  third_party_tools: [WebFetch, WebSearch]
  internal_domains: ["acme-capital.example", "*.acme-capital.example", "*.corp.local", "*.internal", "*.acme.test"]   # [SF-07]
  allowed_link_domains: ["docs.acme-capital.example", "assets.acme-capital.example", "assets.aegis-corp.example"]   # [SF-06]
  egress_allowlist: []                  # empty = rely on controls

providers:
  anthropic:        {wire: anthropic, base_url: "https://api.anthropic.com", destination: remote, passthrough_auth: true, api_key_env: ANTHROPIC_API_KEY, redact_system: false}
  openai:           {wire: openai, base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY, enabled_if_env: OPENAI_API_KEY, destination: remote}
  openrouter:       {wire: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, enabled_if_env: OPENROUTER_API_KEY, destination: remote}
  ollama:           {wire: ollama, base_url: "http://127.0.0.1:11434", destination: local, timeout_s: 300}
  ollama-openai:    {wire: openai, base_url: "http://127.0.0.1:11434/v1", destination: local, timeout_s: 300}
  ollama-anthropic: {wire: anthropic, base_url: "http://127.0.0.1:11434", destination: local, timeout_s: 300}
  # Mock ports: env override via ${AEGIS_MOCK_LLM_PORT:-8791} is optional (Addendum A-55);
  # literal default ports are used here so the file works without expansion.
  mock-anthropic:   {wire: anthropic, base_url: "http://127.0.0.1:8791", destination: remote, timeout_s: 30}
  mock-openai:      {wire: openai, base_url: "http://127.0.0.1:8791/v1", destination: remote, timeout_s: 30}

models:
  allowed: ["claude-*", "gpt-4.1-mini", "meta-llama/*", "aegis-judge*", "qwen*", "hf.co/*", "mock-*"]
  denied: ["*:cloud", "aegis-guard*"]   # cloud models are external; the guard model is not a chat model
  routes:                               # first match wins; `wire` filters by the API the client used (no cross-wire translation)
    - {match: mock-*, provider: mock-anthropic, wire: anthropic}
    - {match: mock-*, provider: mock-openai, wire: openai}
    - {match: claude-*, provider: anthropic, wire: anthropic}
    - {match: gpt-*, provider: openai, wire: openai}
    - {match: meta-llama/*, provider: openrouter, wire: openai}
    - {match: "*", provider: ollama-openai, wire: openai}
    - {match: "*", provider: ollama, wire: ollama}
    - {match: "*", provider: ollama-anthropic, wire: anthropic}
  downgrade:
    - {from: "claude-opus-*",   to: "claude-sonnet-4-5"}
    - {from: "claude-sonnet-*", to: "claude-haiku-4-5"}
    - {from: "*",               to: "aegis-judge"}
  default_local: "aegis-judge"

budgets:                                # amounts = config/org.seed.yaml `budgets:` reference values
  defaults: {soft_pct: 80, on_soft: downgrade, on_hard: block, local_concurrency: 1, max_output_tokens: 4096}
  timezone: Europe/Warsaw               # extra (Addendum A-34): calendar windows
  limits:
    - {scope: "org:acme-capital",              window: day,     usd: 150, compute_s: 14400, tokens: 12000000}
    - {scope: "org:acme-capital",              window: month,   usd: 3000, spend_usd: 10000, tokens: 240000000, compute_s: 300000}
    - {scope: "team:trading",                  window: day,     usd: 60, tokens: 4000000, compute_s: 1800}
    - {scope: "team:trading",                  window: month,   usd: 1200, spend_usd: 2000, tokens: 80000000}
    - {scope: "team:research",                 window: day,     usd: 15, compute_s: 7200, tokens: 1500000}
    - {scope: "team:research", window: month, usd: 300}
    - {scope: "team:platform",                 window: day,     usd: 50, tokens: 6000000, compute_s: 3600}
    - {scope: "team:platform", window: month, usd: 1000}
    - {scope: "member:*",                      window: day,     usd: 5, tokens: 500000}          # each human member (playground)
    - {scope: "agent:claude-code@platform",    window: day,     usd: 30, tokens: 5000000}
    - {scope: "agent:trading-copilot@trading", window: day,     usd: 20, tokens: 1500000}
    - {scope: "agent:research-agent@research", window: day,     compute_s: 5400, usd: 2}
    - {scope: "agent:chaos-agent@platform",    window: day,     usd: 0.50, tokens: 100000, on_hard: require_approval, on_soft: warn, compute_s: 120, label: "red-team agent: tiny on purpose"}   # F6
    - {scope: "session:*",                     window: session, usd: 5.0, tokens: 3000000, requests: 300, tool_calls: 400}
    - scope: "session:*"
      match_agents: [trading-copilot@trading]
      window: session
      usd: 1.0
      tokens: 200000
      requests: 30
      tool_calls: 20
    - scope: "session:*"
      match_agents: [research-agent@research]
      window: session
      compute_s: 600
      requests: 40
      tool_calls: 30
    - {scope: "model:claude-opus-*", window: day, usd: 20, label: "Opus org-wide daily cap"}
    - scope: "agent:selftest-zero"
      window: day
      usd: 0
      label: "self-test fixture: proves hard limits block (BUD-01)"
  loops: {repeat: 3, window: 20, cycle_k: 3, error_streak: 5, max_steps_per_session: 200, ladder: [tool_error, block, kill]}
  rate: {requests_per_min: 120, tool_calls_per_min: 60}
  kill_switch: {global: false, teams: [], members: [], agents: [], sessions: []}

actions:                                # shared classification (aegis.actions.classify); ORDER MATTERS, first match wins
  # --- spend (ACT-01): MCP / tool calls
  - {id: spend.subscription, category: spend, tools: ["marketpulse.purchase_subscription", "*.purchase_subscription", "*.subscribe"],
     amount_arg: amount_usd, resource_arg: vendor, resource_prefix: "vendor:", title: "{agent} wants to spend ${amount} on {args.vendor} {args.plan}"}
  - {id: spend.charge, category: spend, tools: ["payments.create_charge", "*.create_charge", "*.checkout*", "*.top_up*", "*.purchase*"],
     amount_arg: amount_usd, resource_arg: vendor, resource_prefix: "vendor:", title: "{agent} wants to pay ${amount} to {args.vendor}"}
  - {id: spend.transfer, category: spend, tools: ["*.transfer_funds", "*.wire_transfer", "*.send_payment", "payments.transfer*"],
     amount_arg: amount_usd, title: "{agent} wants to transfer ${amount}"}
  # --- spend via /egress to the mock payments API (Addendum A-13: tool_args = {method, url, json, body})
  - {id: spend.subscription, category: spend, surfaces: [egress.request], url_hosts: ["pay.saas.test"],
     args_match: {"method": "^POST$", "url": "/payments/subscriptions"}, amount_arg: json.amount_usd, resource_arg: json.vendor, resource_prefix: "vendor:"}
  - {id: spend.charge, category: spend, surfaces: [egress.request], url_hosts: ["pay.saas.test"],
     args_match: {"method": "^POST$", "url": "/payments/charges"}, amount_arg: json.amount_usd, resource_arg: json.vendor, resource_prefix: "vendor:"}
  # --- data (ACT-02 refines sensitivity/env labels from rt.org.resources())
  - {id: db.schema, category: data_write, tools: ["acme-db.query", "*.query_sql", "*.run_sql", "sql.*"],
     args_match: {sql: "(?i)^\\s*(drop|alter|truncate|create|grant|revoke|rename)\\b"},
     resource_arg: sql, resource_regex: "(?i)\\b(?:table|into|from)\\s+([a-z_][a-z0-9_\\.]*)", resource_prefix: "db:"}
  - {id: db.write, category: data_write, tools: ["acme-db.query", "*.query_sql", "*.run_sql", "sql.*"],
     args_match: {sql: "(?i)^\\s*(insert|update|delete|merge|replace|upsert|copy)\\b"},
     resource_arg: sql, resource_regex: "(?i)\\b(?:into|update|from|table)\\s+([a-z_][a-z0-9_\\.]*)", resource_prefix: "db:"}
  - {id: db.read, category: data_read, tools: ["acme-db.query", "*.query_sql", "*.run_sql", "sql.*"],
     resource_arg: sql, resource_regex: "(?i)\\bfrom\\s+([a-z_][a-z0-9_\\.]*)", resource_prefix: "db:"}
  # --- external send (ACT-03); recipient subdomains of the firm count as internal [SF-07]
  - {id: email.external, category: external_send, tools: ["mailer.send_email", "*.send_email"], args_match: {to: "@"},
     args_not_match: {to: "(?i)@([a-z0-9-]+\\.)*acme-capital\\.example\\s*$"}, title: "{agent} wants to email {args.to}"}
  - {id: email.internal, category: other, tools: ["mailer.send_email", "*.send_email"]}
  - {id: egress.post, category: external_send, surfaces: [egress.request], args_match: {"method": "^(POST|PUT|PATCH)$"}}
  - {id: egress.post, category: external_send, tools: ["*.post_message", "*.upload*", "*.webhook*", "slack.*"]}
  - {id: egress.get, category: other, tools: ["WebFetch", "web.fetch_url"]}
  - {id: egress.get, category: other, surfaces: [egress.request]}
  # --- code (ACT-04 / SIG-03); SIG-03 owns approval of unknown packages, ACT-04 logs package.install in balanced
  - {id: code.deploy, category: code_exec, tools: ["Bash"],
     args_match: {command: "(?i)\\b(terraform\\s+(apply|destroy)|kubectl\\s+(apply|delete|rollout|scale)|helm\\s+(install|upgrade|uninstall)|git\\s+push\\b)"}}
  - {id: package.install, category: code_exec, tools: ["Bash"],
     args_match: {command: "(?i)\\b(pip3?|uv\\s+pip|uv|poetry|npm|pnpm|yarn|brew|apt(-get)?|gem|cargo|go)\\s+(install|add|i)\\b"}}
  - {id: code.exec, category: code_exec, tools: ["Bash"],
     args_match: {command: "(?i)\\b((docker|podman)\\s+run|ssh|scp|rsync|python3?\\s+-c|node\\s+-e)\\b"}}

# ---------------------------------------------------------------------------
# approvals: BEGIN - byte-identical copy of docs/seed-fixes/approvals.yaml
# ---------------------------------------------------------------------------
approvals:
  defaults:
    ttl_s: 900                       # pending TTL; expired => denied semantics
    on_timeout: deny
    max_pending: 50
    default_approver: admin          # action | budget_raise | mcp_pin matching no rule (fail closed)
    default_config_approver: owner   # config_change matching no rule (fail closed) [SF-10]
    hold_s: {hook: 60, mcp: 30, egress: 15, guard: 0, proxy: 0, playground: 0, dashboard: 0}
    # --- approvals-engine extras (whitelisted, Addendum A-34) ---
    grant_ttl_s: 900                 # how long an approval can be redeemed after it is given
    max_pending_per_principal: 10    # anti human-in-the-loop flooding (ASI09 / T10)
    redeem_window_s: 30              # hook + MCP proxy redeeming the same call count as one use
    deny_cooldown_s: 60              # identical call just denied -> same denied request, no new card
    sweep_interval_s: 1
    clock_multiplier: 1              # demo: 60 => TTL minutes behave like seconds (could)

  # ---------------------------------------------------------------------------
  # Agent actions, budget overrides, MCP re-pins, org changes. FIRST MATCH WINS.
  # ---------------------------------------------------------------------------
  rules:
    # --- org governance (org-rbac: create_manual, kind=action, action_type=org.*) [SF-23]
    - {id: org-owner-grants, description: "Granting or revoking the owner role always needs an owner (hard floor in code too)",
       when: {kind: [action], action: ["org.role.promote_owner", "org.role.demote_owner", "org.member.create_owner"]}, approver: owner, ttl_s: 3600}
    - {id: org-privileged, description: "Promote/demote admins, add an admin, deactivate an admin/owner, widen an agent's destination",
       when: {kind: [action], action: ["org.role.*", "org.member.create_admin", "org.member.deactivate_privileged", "org.agent.widen_destination"]}, approver: owner, ttl_s: 3600}
    - {id: org-routine, description: "Routine member/agent administration (admins apply these directly)",
       when: {kind: [action], action: ["org.member.*", "org.agent.*"]}, approver: admin}

    # --- spend (ACT-01): <= $20 self | <= $200 admin | > $200 owner | > $1,000 owner + admin
    #     above ACT-01 hard_block_above_usd ($5,000 balanced) a call is blocked and never gets here
    - {id: spend-owner-2p, aliases: [APR-SPEND-TWO-PERSON], description: "Over $1,000: owner plus a second admin (two-person rule)",
       when: {action: ["spend.*"], amount_usd_gt: 1000}, approver: owner, two_person: true, ttl_s: 7200}
    - {id: spend-owner, aliases: [APR-SPEND-OWNER], description: "Over $200 (e.g. the $480 GPU reservation)",
       when: {action: ["spend.*"], amount_usd_gt: 200}, approver: owner}
    - {id: spend-strict-vendor, aliases: [APR-SPEND-STRICT-UNAPPROVED-VENDOR], description: "Strict: vendor not on the approved list",
       when: {action: ["spend.*"], profiles: [strict, paranoid], labels: {vendor_approved: "false"}}, approver: admin}
    - {id: spend-strict-recurring, aliases: [APR-SPEND-STRICT-RECURRING], description: "Strict: every new subscription",
       when: {action: ["spend.*"], profiles: [strict, paranoid], labels_in: {recurring: [monthly, yearly]}}, approver: admin}
    - {id: spend-admin, aliases: [APR-SPEND-ADMIN], description: "$20.01-$200 (e.g. the $50/month MarketPulse Pro subscription)",
       when: {action: ["spend.*"], amount_usd_gt: 20}, approver: admin}
    - {id: spend-self, aliases: [APR-SPEND-SELF], description: "Up to $20: the member (or the agent's sponsor) confirms",
       when: {action: ["spend.*"]}, approver: self, grant_ttl_s: 600}

    # --- data access (ACT-02): table sensitivity + environment labels
    - {id: db-restricted, aliases: [APR-DATA-RESTRICTED], description: "PCI: no agent may read raw card data, whoever approves",
       when: {action: ["db.*"], labels_in: {sensitivity: [RESTRICTED, SECRET]}}, approver: deny}
    - {id: db-prod-ddl, aliases: [APR-DATA-PROD-DDL], description: "Schema changes on prod go through migrations, never an agent",
       when: {action: ["db.schema"], labels: {env: prod}}, approver: deny}
    - {id: db-prod-bulk-delete-strict, aliases: [APR-DATA-PROD-BULK-DELETE], description: "Strict: unbounded prod DELETE/UPDATE needs owner + admin [SF-08]",
       when: {action: ["db.write"], profiles: [strict, paranoid], labels: {env: prod, bulk: "true"}}, approver: owner, two_person: true}
    - {id: db-prod-write, aliases: [APR-DATA-PROD-WRITE], description: "Any agent write to a production database",
       when: {action: ["db.write"], labels: {env: prod}}, approver: owner, grant_ttl_s: 600}
    - {id: db-staging-write, aliases: [APR-DATA-STAGING-WRITE],
       when: {action: ["db.write"], labels: {env: staging}}, approver: self}
    - {id: db-write, description: "Writes/DDL outside prod/staging labels (fail closed)",
       when: {action: ["db.write", "db.schema"]}, approver: admin}
    - {id: db-pii-read, aliases: [APR-DATA-CONFIDENTIAL-READ], description: "E.g. SELECT * FROM customers (PII); rows still pass DLP before a remote model sees them",
       when: {action: ["db.read"], labels: {sensitivity: CONFIDENTIAL}}, approver: admin, grant_ttl_s: 3600}
    - {id: db-internal-read, aliases: [APR-DATA-INTERNAL-READ],
       when: {action: ["db.read"], profiles: [strict, balanced], labels: {sensitivity: INTERNAL}}, approver: self, grant_ttl_s: 3600}
    - {id: db-read, aliases: [APR-DATA-PUBLIC-READ, APR-DATA-INTERNAL-READ-PERMISSIVE], description: "Public data (unknown sensitivity falls through to admin)",
       when: {action: ["db.read"], labels_in: {sensitivity: [PUBLIC, INTERNAL]}}, approver: auto}

    # --- external send (ACT-03, EXE-03): data class in the payload + signals
    - {id: send-restricted, aliases: [APR-SEND-EXTERNAL-RESTRICTED], description: "Card data or secrets to a third party: never",
       when: {action: ["email.external", "egress.post"], labels_in: {data_class: [RESTRICTED, SECRET]}}, approver: deny}
    - {id: send-tainted, aliases: [APR-SEND-TAINTED], description: "Session read private data AND saw untrusted content (lethal trifecta)",
       when: {action: ["email.*", "egress.post"], signals_any: [lethal_trifecta]}, approver: admin}
    - {id: send-peer, aliases: [APR-SEND-PEER-INITIATED], description: "A peer agent asked us to send (inert until A2A)",
       when: {action: ["email.*", "egress.post"], signals_any: [peer_initiated]}, approver: admin}
    - {id: send-confidential, aliases: [APR-SEND-EXTERNAL-CONFIDENTIAL], description: "Client data (even tokenized) leaving the firm",
       when: {action: ["email.external", "egress.post"], labels: {data_class: CONFIDENTIAL}}, approver: admin}
    - {id: send-bulk, aliases: [APR-SEND-BULK],
       when: {action: ["email.external"], labels: {bulk: "true"}}, approver: admin}
    - {id: send-internal, aliases: [APR-SEND-INTERNAL],
       when: {action: ["email.internal"]}, approver: auto}
    - {id: external-send-permissive, aliases: [APR-SEND-EXTERNAL-PUBLIC-PERMISSIVE],
       when: {action: ["email.external", "egress.post"], profiles: [permissive]}, approver: auto}
    - {id: external-send, aliases: [APR-SEND-EXTERNAL-PUBLIC],
       when: {action: ["email.external", "egress.post"]}, approver: self}

    # --- code execution & packages (ACT-04, SIG-03, EXE-01)
    - {id: pkg-unknown, aliases: [APR-EXEC-PKG-UNKNOWN], description: "Possible slopsquatting (SIG-03 signal unknown_package)",
       when: {action: ["package.install"], signals_any: [unknown_package]}, approver: admin}
    - {id: code-exec-strict, aliases: [APR-EXEC-STRICT],
       when: {action: ["package.install", "code.exec"], profiles: [strict, paranoid]}, approver: admin}
    - {id: code-exec-remote-shell, aliases: [APR-EXEC-REMOTE-SHELL],
       when: {action: ["code.exec"], labels: {pattern: remote_shell}}, approver: admin}
    - {id: code-exec-unsandboxed, aliases: [APR-EXEC-UNSANDBOXED],
       when: {action: ["code.exec"], labels: {sandboxed: "false"}}, approver: admin}
    - {id: code-exec-sandboxed, aliases: [APR-EXEC-SANDBOXED],
       when: {action: ["code.exec"], labels: {sandboxed: "true"}}, approver: self}
    - {id: pkg-install-permissive, aliases: [APR-EXEC-PKG-KNOWN-PERMISSIVE],
       when: {action: ["package.install"], profiles: [permissive]}, approver: auto}
    - {id: pkg-install, aliases: [APR-EXEC-PKG-KNOWN],
       when: {action: ["package.install"]}, approver: self}
    - {id: code-exec, description: "code.exec without a sandbox label (fail closed)",
       when: {action: ["code.exec"]}, approver: admin}

    # --- deploy (ACT-04): env label prod | mainline | staging | dev
    - {id: deploy-prod-strict, aliases: [APR-DEPLOY-PROD-STRICT],
       when: {action: ["code.deploy"], profiles: [strict, paranoid], labels: {env: prod}}, approver: owner, two_person: true}
    - {id: deploy-prod, aliases: [APR-DEPLOY-PROD],
       when: {action: ["code.deploy"], labels: {env: prod}}, approver: owner, grant_ttl_s: 600}
    - {id: deploy-mainline, aliases: [APR-DEPLOY-MAINLINE], description: "Push to main/release (stands in for code review)",
       when: {action: ["code.deploy"], labels: {env: mainline}}, approver: admin}
    - {id: deploy-staging, aliases: [APR-DEPLOY-STAGING],
       when: {action: ["code.deploy"], labels: {env: staging}}, approver: self}
    - {id: deploy-dev, aliases: [APR-DEPLOY-DEV],
       when: {action: ["code.deploy"], labels: {env: dev}}, approver: auto}
    - {id: deploy, when: {action: ["code.deploy"]}, approver: admin}

    # --- other governed actions [SF-24]
    - {id: dlp-release, description: "A judge set a destinations.matrix cell to require_approval (DLP-01)",
       when: {action: ["dlp.release"]}, approver: admin}
    - {id: goal-drift, description: "INJ-05 drift (only when INJ-05 is in enforce mode)",
       when: {action: ["agent.goal_drift"]}, approver: self}
    - {id: tool-approve, description: "GOV-04 generic approve_tools (action_type tool:<server>.<tool>)",
       when: {action: ["tool:*"]}, approver: admin}

    # --- budget overrides from BUD-01 (on_hard: require_approval) and MCP re-pins from MCP-03
    - {id: budget-override, description: "Agent hit a hard budget with on_hard: require_approval (F6)",
       when: {kind: [budget_raise]}, approver: admin}
    - {id: mcp-repin-internal, aliases: [APR-MCP-REAPPROVE-INTERNAL],
       when: {kind: [mcp_pin], labels: {dest: local}}, approver: self}
    - {id: mcp-repin, aliases: [APR-MCP-REAPPROVE-EXTERNAL], description: "Changed/new third-party MCP tool (possible rug pull)",
       when: {kind: [mcp_pin]}, approver: admin}

  # ---------------------------------------------------------------------------
  # Config changes (GOV-05). `action` globs match PolicyChange.kind. Per-change
  # facts usable in `labels`: control_id, control_severity, loosening ("true"/
  # "false"), scope, scope_type, model_dest, provider_new, signature_severity,
  # requester_is_sponsor. FIRST MATCH WINS; multi-change = highest level.
  # ---------------------------------------------------------------------------
  config_rules:
    - {id: approval-rules, description: "Who-may-approve-what is owner territory",
       when: {action: ["approval.rule"]}, approver: owner}
    - {id: protect-more, aliases: [APR-CTRL-ENABLE, APR-POLICY-TIGHTEN], description: "Turning protection ON is always free",
       when: {action: ["control.enable", "control.add", "control.action.tighten", "control.threshold.tighten", "model.disallow"]}, approver: auto}
    - {id: mode-tighten, when: {action: ["control.mode"], labels: {loosening: "false"}}, approver: auto}
    - {id: disable-control-strict, aliases: [APR-CTRL-STRICT], description: "Strict: owner + a second admin",
       when: {action: ["control.disable", "control.remove", "control.mode", "control.action.loosen"], profiles: [strict, paranoid]}, approver: owner, two_person: true, ttl_s: 3600}
    - {id: disable-control-critical, aliases: [APR-CTRL-BALANCED-CRITICAL], description: "Critical controls (DLP-02, EXE-01, SIG-01, SIG-02)",
       when: {action: ["control.disable", "control.remove", "control.mode", "control.action.loosen"], labels: {control_severity: critical}}, approver: owner}
    - {id: disable-control-permissive, aliases: [APR-CTRL-PERMISSIVE],
       when: {action: ["control.disable", "control.remove", "control.mode", "control.action.loosen"], profiles: [permissive]}, approver: self}
    - {id: disable-control, aliases: [APR-CTRL-BALANCED],
       when: {action: ["control.disable", "control.remove", "control.mode", "control.action.loosen"]}, approver: admin}
    - {id: raise-org-2x, aliases: [APR-BUDGET-ORG-OVER-2X],
       when: {action: ["budget.raise"], scope_type: [org], increase_pct_gt: 100}, approver: owner, two_person: true}
    - {id: raise-org, aliases: [APR-BUDGET-ORG],
       when: {action: ["budget.raise"], scope_type: [org]}, approver: owner}
    - {id: raise-large, aliases: [APR-BUDGET-TEAM-OVER-2X], description: "Team budget more than doubled (e.g. 60 -> 150)",
       when: {action: ["budget.raise"], scope_type: [team], increase_pct_gt: 100}, approver: owner}
    - {id: raise-team-small, aliases: [APR-BUDGET-TEAM-2X], description: "Team budget raised up to 2x (e.g. 60 -> 75) [SF-09]",
       when: {action: ["budget.raise"], scope_type: [team]}, approver: admin}
    - {id: raise-agent-large, aliases: [APR-BUDGET-AGENT-LARGE],
       when: {action: ["budget.raise"], scope_type: [member, agent, session], increase_pct_gt: 50}, approver: admin}
    - {id: raise-small, aliases: [APR-BUDGET-AGENT-SMALL], description: "Sponsor gives their own agent up to +50 %",
       when: {action: ["budget.raise"], scope_type: [member, agent, session]}, approver: self}
    - {id: raise-other, when: {action: ["budget.raise", "budget.remove"]}, approver: owner}
    - {id: budget-tighten, when: {action: ["budget.lower", "budget.add"]}, approver: admin}
    - {id: profile-down, aliases: [APR-POLICY-PROFILE-DOWN],
       when: {action: ["profile.change"], labels: {loosening: "true"}}, approver: owner}
    - {id: profile-up, when: {action: ["profile.change"]}, approver: auto}
    - {id: killswitch-release-global, aliases: [APR-KILL-RELEASE-GLOBAL],
       when: {action: ["killswitch.off"], labels: {scope: global}}, approver: owner}
    - {id: loosen-threshold, aliases: [APR-KILL-RELEASE], description: "Loosen a threshold or release a (non-global) kill switch; the sponsor cannot release alone",
       when: {action: ["control.threshold.loosen", "killswitch.off"]}, approver: admin}
    - {id: killswitch-own-agent, aliases: [APR-KILL-ENGAGE], description: "Anyone may pull the brake on an agent they sponsor [SF-16]",
       when: {action: ["killswitch.on"], labels: {requester_is_sponsor: "true"}}, approver: auto}
    - {id: tighten, description: "Kill switch on anything else (incl. global) [SF-16]",
       when: {action: ["killswitch.on"]}, approver: admin}
    - {id: provider-change, when: {action: ["provider.change", "route.change"]}, approver: owner}
    - {id: model-new-provider, aliases: [APR-MODEL-NEW-PROVIDER], description: "A new data processor (DPA / vendor review)",
       when: {action: ["model.allow"], labels: {provider_new: "true"}}, approver: owner}
    - {id: model-allow-local, aliases: [APR-MODEL-LOCAL],
       when: {action: ["model.allow"], labels: {model_dest: local}}, approver: self}
    - {id: model-allow, aliases: [APR-MODEL-REMOTE],
       when: {action: ["model.allow"]}, approver: admin}
    - {id: feed-override-critical, aliases: [APR-FEED-OVERRIDE-CRITICAL],
       when: {action: ["feed.override"], labels: {signature_severity: critical}}, approver: owner}
    - {id: feed-override, aliases: [APR-FEED-OVERRIDE],
       when: {action: ["feed.override"]}, approver: admin}
    - {id: mcp-server-strict, aliases: [APR-MCP-REGISTER-STRICT],
       when: {action: ["mcp.server"], profiles: [strict, paranoid]}, approver: owner}
    - {id: mcp-server, aliases: [APR-MCP-REGISTER],
       when: {action: ["mcp.server"]}, approver: admin}
    - {id: control-params-loosen, when: {action: ["control.params"], labels: {loosening: "true"}}, approver: admin}
    - {id: policy-loosen-strict, aliases: [APR-POLICY-LOOSEN-STRICT],
       when: {profiles: [strict, paranoid], labels: {loosening: "true"}}, approver: owner}
    - {id: policy-loosen, aliases: [APR-POLICY-LOOSEN],
       when: {labels: {loosening: "true"}}, approver: admin}
    - {id: policy-neutral, aliases: [APR-POLICY-NEUTRAL], description: "Descriptions, comments, new examples",
       when: {action: ["control.params", "other"]}, approver: self}

  # ---------------------------------------------------------------------------
  # Routing self-tests (approvals-engine extra `tests`; run by its unit tests and
  # after every policy apply; a failure is a warning, never a rejection).
  # request.requester = member id or agent id from config/org.seed.yaml.
  # approvers_ok: an id = that person alone completes the approval; a [pair] =
  # those two together complete a two-person approval. approvers_not_ok: ids
  # that may NOT vote. `facts` on a change = precomputed per-change facts.
  # Verified by synth-A with a first-match simulator (all cases pass).
  # ---------------------------------------------------------------------------
  tests:
    # --- the 34 ported staging routing tests (`staging: true`)
    - {name: saas-subscription-50-needs-admin, staging: true, request: {kind: action, action_type: spend.subscription, requester: trading-copilot@trading, amount_usd: 50, resource: "vendor:marketpulse", labels: {vendor_approved: "true", recurring: monthly}},
       expect: {required_role: admin, rule: spend-admin, approvers_ok: [u_emily, u_marek, u_katarzyna], approvers_not_ok: [u_piotr, u_olivia, trading-copilot@trading]}}
    - {name: spend-20-is-self, staging: true, request: {kind: action, action_type: spend.charge, requester: research-agent@research, amount_usd: 20, resource: "vendor:opendata-shop", labels: {vendor_approved: "true", recurring: none}},
       expect: {required_role: self, rule: spend-self, approvers_ok: [u_agnieszka], approvers_not_ok: [u_james, research-agent@research]}}
    - {name: spend-20.01-is-admin, staging: true, request: {kind: action, action_type: spend.charge, requester: research-agent@research, amount_usd: 20.01, labels: {vendor_approved: "true", recurring: none}},
       expect: {required_role: admin, rule: spend-admin}}
    - {name: spend-200-is-admin, staging: true, request: {kind: action, action_type: spend.charge, requester: claude-code@platform, amount_usd: 200, labels: {vendor_approved: "true", recurring: none}},
       expect: {required_role: admin, rule: spend-admin}}
    - {name: spend-480-needs-owner, staging: true, request: {kind: action, action_type: spend.charge, requester: claude-code@platform, amount_usd: 480, resource: "vendor:gpucloud", labels: {vendor_approved: "true", recurring: none}},
       expect: {required_role: owner, rule: spend-owner, approvers_ok: [u_katarzyna], approvers_not_ok: [u_marek, u_emily, u_tomasz]}}
    - {name: spend-4800-two-person, staging: true, request: {kind: action, action_type: spend.subscription, requester: trading-copilot@trading, amount_usd: 4800, resource: "vendor:marketpulse", labels: {vendor_approved: "true", recurring: yearly}},
       expect: {required_role: owner, two_person: true, rule: spend-owner-2p, approvers_ok: [[u_katarzyna, u_emily], [u_katarzyna, u_marek]], approvers_not_ok: [u_piotr]}}
    - {name: strict-unapproved-vendor-small, staging: true, profile: strict, request: {kind: action, action_type: spend.subscription, requester: trading-copilot@trading, amount_usd: 15, resource: "vendor:shady-signals", labels: {vendor_approved: "false", recurring: monthly}},
       expect: {required_role: admin, rule: spend-strict-vendor}}
    - {name: read-customers-pii-needs-admin, staging: true, request: {kind: action, action_type: db.read, requester: research-agent@research, resource: "db:customers", labels: {sensitivity: CONFIDENTIAL, env: prod}},
       expect: {required_role: admin, rule: db-pii-read, approvers_not_ok: [u_agnieszka]}}
    - {name: prod-db-write-needs-owner, staging: true, request: {kind: action, action_type: db.write, requester: claude-code@platform, resource: "db:customers", labels: {sensitivity: CONFIDENTIAL, env: prod}},
       expect: {required_role: owner, rule: db-prod-write}}
    - {name: read-card-table-denied, staging: true, request: {kind: action, action_type: db.read, requester: trading-copilot@trading, resource: "db:payment_cards", labels: {sensitivity: RESTRICTED, env: prod}},
       expect: {required_role: deny, rule: db-restricted}}
    - {name: prod-ddl-denied, staging: true, request: {kind: action, action_type: db.schema, requester: chaos-agent@platform, resource: "db:trades", labels: {sensitivity: CONFIDENTIAL, env: prod}},
       expect: {required_role: deny, rule: db-prod-ddl}}
    - {name: staging-write-self, staging: true, request: {kind: action, action_type: db.write, requester: claude-code@platform, resource: "db:customers_synthetic", labels: {sensitivity: INTERNAL, env: staging}},
       expect: {required_role: self, rule: db-staging-write, approvers_ok: [u_tomasz]}}
    - {name: external-email-with-client-name-admin, staging: true, request: {kind: action, action_type: email.external, requester: trading-copilot@trading, resource: "host:poczta.example", labels: {data_class: CONFIDENTIAL}},
       expect: {required_role: admin, rule: send-confidential}}
    - {name: external-send-card-denied, staging: true, request: {kind: action, action_type: email.external, requester: trading-copilot@trading, resource: "host:client-portal.example", labels: {data_class: RESTRICTED}},
       expect: {required_role: deny, rule: send-restricted}}
    - {name: internal-email-auto, staging: true, request: {kind: action, action_type: email.internal, requester: trading-copilot@trading, resource: "host:smtp.acme-capital.example", labels: {data_class: CONFIDENTIAL}},
       expect: {required_role: auto, rule: send-internal}}
    - {name: unknown-package-admin, staging: true, request: {kind: action, action_type: package.install, requester: claude-code@platform, labels: {signals: unknown_package, sandboxed: "false"}},
       expect: {required_role: admin, rule: pkg-unknown}}
    - {name: prod-terraform-owner, staging: true, request: {kind: action, action_type: code.deploy, requester: claude-code@platform, labels: {env: prod, pattern: terraform_apply}},
       expect: {required_role: owner, rule: deploy-prod}}
    - {name: prod-terraform-strict-two-person, staging: true, profile: strict, request: {kind: action, action_type: code.deploy, requester: claude-code@platform, labels: {env: prod, pattern: terraform_apply}},
       expect: {required_role: owner, two_person: true, rule: deploy-prod-strict}}
    - {name: team-monthly-raise-under-2x-admin, staging: true, request: {kind: config_change, requester: u_piotr, changes: [{kind: budget.raise, path: "budgets.limits[scope=team:trading,window=month].usd", scope: "team:trading", dimension: usd, before: 1200, after: 2000, increase_pct: 66.67, loosening: true}]},
       expect: {required_role: admin, rule: raise-team-small, gov05: require_approval, approvers_ok: [u_emily, u_marek, u_katarzyna], approvers_not_ok: [u_piotr]}}
    - {name: team-monthly-raise-exactly-2x-admin, staging: true, request: {kind: config_change, requester: u_agnieszka, changes: [{kind: budget.raise, path: "budgets.limits[scope=team:research,window=month].usd", scope: "team:research", dimension: usd, before: 300, after: 600, increase_pct: 100, loosening: true}]},
       expect: {required_role: admin, rule: raise-team-small}}
    - {name: team-monthly-raise-over-2x-owner, staging: true, request: {kind: config_change, requester: u_agnieszka, changes: [{kind: budget.raise, path: "budgets.limits[scope=team:research,window=month].usd", scope: "team:research", dimension: usd, before: 300, after: 900, increase_pct: 200, loosening: true}]},
       expect: {required_role: owner, rule: raise-large, approvers_ok: [u_katarzyna], approvers_not_ok: [u_emily]}}
    - {name: org-budget-raise-owner, staging: true, request: {kind: config_change, requester: u_marek, changes: [{kind: budget.raise, path: "budgets.limits[scope=org:acme-capital,window=day].usd", scope: "org:acme-capital", dimension: usd, before: 150, after: 200, increase_pct: 33.33, loosening: true}]},
       expect: {required_role: owner, rule: raise-org, approvers_ok: [u_katarzyna], approvers_not_ok: [u_marek]}}
    - {name: org-budget-raise-by-sole-owner, staging: true, request: {kind: config_change, requester: u_katarzyna, changes: [{kind: budget.raise, path: "budgets.limits[scope=org:acme-capital,window=month].usd", scope: "org:acme-capital", dimension: usd, before: 3000, after: 4000, increase_pct: 33.33, loosening: true}]},
       expect: {required_role: owner, rule: raise-org, gov05: allow}}
    - {name: disable-control-strict-two-person, staging: true, profile: strict, request: {kind: config_change, requester: u_marek, changes: [{kind: control.disable, path: "controls[id=INJ-02].enabled", control_id: INJ-02, before: true, after: false, loosening: true}]},
       expect: {required_role: owner, two_person: true, rule: disable-control-strict, approvers_ok: [[u_katarzyna, u_emily]], approvers_not_ok: [u_marek]}}
    - {name: disable-control-balanced-admin, staging: true, request: {kind: config_change, requester: u_marek, changes: [{kind: control.disable, path: "controls[id=INJ-03].enabled", control_id: INJ-03, before: true, after: false, loosening: true}]},
       expect: {required_role: admin, rule: disable-control, gov05: allow, approvers_ok: [u_emily, u_katarzyna], approvers_not_ok: [u_marek]}}
    - {name: disable-critical-balanced-owner, staging: true, request: {kind: config_change, requester: u_emily, changes: [{kind: control.disable, path: "controls[id=DLP-02].enabled", control_id: DLP-02, before: true, after: false, loosening: true}]},
       expect: {required_role: owner, rule: disable-control-critical, gov05: require_approval}}
    - {name: enable-control-auto, staging: true, request: {kind: config_change, requester: u_olivia, changes: [{kind: control.enable, path: "controls[id=INJ-03].enabled", control_id: INJ-03, before: false, after: true, loosening: false}]},
       expect: {required_role: auto, rule: protect-more, gov05: allow}}
    - {name: allow-known-provider-remote-model-admin, staging: true, request: {kind: config_change, requester: u_olivia, changes: [{kind: model.allow, path: "models.allowed", after: "claude-opus-*", loosening: true, facts: {model_dest: remote, provider_new: "false"}}]},
       expect: {required_role: admin, rule: model-allow}}
    - {name: allow-new-provider-owner, staging: true, request: {kind: config_change, requester: u_olivia, changes: [{kind: model.allow, path: "models.allowed", after: "gpt-4.1-mini", loosening: true, facts: {model_dest: remote, provider_new: "true"}}]},
       expect: {required_role: owner, rule: model-new-provider}}
    - {name: profile-down-owner, staging: true, request: {kind: config_change, requester: u_marek, changes: [{kind: profile.change, path: "profile", before: balanced, after: permissive, loosening: true}]},
       expect: {required_role: owner, rule: profile-down}}
    - {name: profile-up-auto, staging: true, request: {kind: config_change, requester: u_tomasz, changes: [{kind: profile.change, path: "profile", before: balanced, after: strict, loosening: false}]},
       expect: {required_role: auto, rule: profile-up}}
    - {name: kill-release-sponsor-cannot-self-release, staging: true, request: {kind: config_change, requester: u_tomasz, changes: [{kind: killswitch.off, path: "budgets.kill_switch.agents", scope: "agent:chaos-agent@platform", before: ["chaos-agent@platform"], after: [], loosening: true}]},
       expect: {required_role: admin, rule: loosen-threshold, approvers_ok: [u_marek, u_emily], approvers_not_ok: [u_tomasz]}}
    - {name: agent-can-never-approve, staging: true, request: {kind: action, action_type: spend.charge, requester: research-agent@research, amount_usd: 5, labels: {vendor_approved: "true", recurring: none}},
       expect: {required_role: self, rule: spend-self, approvers_not_ok: [research-agent@research, chaos-agent@platform, claude-code@platform]}}
    - {name: unmatched-type-fails-closed, staging: true, request: {kind: config_change, action_type: something.new, requester: u_james, changes: []},
       expect: {required_role: owner, rule: null}}
    # --- contract headline flows F4 / F5 / F6 / F9 + org + Addendum A decisions
    - {name: f4-spend-12-sponsor-self-approves, request: {kind: action, action_type: spend.charge, requester: research-agent@research, amount_usd: 12, resource: "vendor:opendata-shop", labels: {vendor_approved: "true", recurring: none}},
       expect: {required_role: self, rule: spend-self, approvers_ok: [u_agnieszka, u_emily], approvers_not_ok: [u_james, research-agent@research]}}
    - {name: f4-spend-1500-owner-plus-admin, request: {kind: action, action_type: spend.charge, requester: trading-copilot@trading, amount_usd: 1500, resource: "vendor:gpucloud", labels: {vendor_approved: "true", recurring: none}},
       expect: {required_role: owner, two_person: true, rule: spend-owner-2p, approvers_ok: [[u_katarzyna, u_marek]], approvers_not_ok: [u_piotr, u_olivia]}}
    - {name: f4-spend-unknown-amount-fails-closed, request: {kind: action, action_type: spend.charge, requester: chaos-agent@platform, resource: "vendor:gpucloud"},
       expect: {required_role: owner, two_person: true, rule: spend-owner-2p}}
    - {name: f4-select-customers-admin, request: {kind: action, action_type: db.read, requester: trading-copilot@trading, resource: "db:customers", labels: {sensitivity: CONFIDENTIAL, env: prod}},
       expect: {required_role: admin, rule: db-pii-read, approvers_ok: [u_emily], approvers_not_ok: [u_piotr]}}
    - {name: f4-delete-trades-prod-owner, request: {kind: action, action_type: db.write, requester: trading-copilot@trading, resource: "db:trades", labels: {sensitivity: CONFIDENTIAL, env: prod, bulk: "true"}},
