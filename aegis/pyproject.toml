[project]
name = "aegis"
version = "0.1.0"
description = "Aegis - local-first AI Control Layer (HackYeah 2026, Goldman Sachs task)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.142.2",
    "google-re2>=1.1.20251105",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp==2.3.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "orjson>=3.12.0",
    "phonenumbers>=9.0",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "pydantic>=2.9",
    "pynacl>=1.6.2",
    "pypdf>=6.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "sse-starlette>=3.5.0",
    "tokenizers>=0.23.2",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
aegis = "aegis.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.uv]
package = true

# ---------------------------------------------------------------- pytest (CONTRACTS section 7.3)
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast unit test (default)",
    "e2e: black-box test against a hermetic gateway",
    "semantic: needs ONNX models or Ollama (skipped with reason when unavailable)",
    "live: needs a running stack (AEGIS_LIVE_URL)",
    "slow: slow test",
    "bench: benchmark",
]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

# ---------------------------------------------------------------- ruff (CONTRACTS section 7.5)
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "."]
extend-exclude = ["staging", "models", "web", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Frozen contract files are materialized verbatim from docs/CONTRACTS.md - never reformat them.
"src/aegis/core/types.py" = ["ALL"]
"src/aegis/core/protocols.py" = ["ALL"]
"src/aegis/core/policy_schema.py" = ["ALL"]
"tests/**" = ["B011", "ASYNC"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "faker>=40.40.0",
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
