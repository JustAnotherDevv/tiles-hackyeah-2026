# Package lists shipped in the signed bundle (`lists`), consumed by SIG-03 (package-install guard)
# and by anyone reading rt.feed.lists(). OSV-like entries; empty `versions` = every version is bad.
malicious_versions:
  # from AEGIS-TI-017 (compromised AI packages / MCP servers)
  - {ecosystem: npm, name: postmark-mcp, versions: ["1.0.16"], ref: koi-2025-09}
  - {ecosystem: pypi, name: litellm, versions: ["1.82.7", "1.82.8"], ref: csa-2026-03}
  - {ecosystem: pypi, name: mistralai, versions: ["2.4.6"], ref: mistral-MAI-2026-002}
  - {ecosystem: vscode, name: amazonwebservices.amazon-q-vscode, versions: ["1.84.0"], ref: CVE-2025-8217}
  # historic npm supply-chain compromises (SIG-03-only self-test)
  - {ecosystem: npm, name: event-stream, versions: ["3.3.6"], ref: npm-2018-flatmap-stream}
  - {ecosystem: npm, name: ua-parser-js, versions: ["0.7.29", "0.8.0", "1.0.0"], ref: GHSA-pjwm-rvh2-c87w}
# names LLMs hallucinate and attackers register (slopsquatting) -> require approval
hallucinated_packages:
  - {ecosystem: pypi, name: huggingface-cli}
  - {ecosystem: pypi, name: langchain-community-tools}
  - {ecosystem: pypi, name: openai-helper}
  - {ecosystem: npm, name: react-codeshift}
