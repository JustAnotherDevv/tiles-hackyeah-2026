# AEGIS-TI-004 - ported from staging/feed-seed by feed_service/port_staging.py (contract shape, CONTRACTS 4.7)
id: AEGIS-TI-004
title: Keras Lambda-layer code execution on model load
description: >-
  CVE-2024-3660 (Keras Lambda layers run arbitrary code on load) and CVE-2025-1550
  (config.json bypasses safe_mode / enable_unsafe_deserialization). Matches a Keras
  model config that declares a Lambda layer, or that re-enables unsafe deserialization.
  The test config declares a Lambda layer with no code body.
status: stable
severity: critical
confidence: high
aliases: [CVE-2024-3660, CVE-2025-1550]
references:
  - https://cveawg.mitre.org/api/cve/CVE-2024-3660
  - https://cveawg.mitre.org/api/cve/CVE-2025-1550
tags: [LLM04:2026, ASI05, AML.T0011, CWE-502]
published: "2024-05-01"
modified: "2026-10-03"
applies_to:
  surfaces: [artifact.file]
match:
  any_of:
    - type: json_path
      path: "$..class_name"
      equals: "Lambda"
    - type: regex
      field: all
      pattern: '(?i)enable_unsafe_deserialization'
action: block
message: "Keras model config declares a Lambda layer or re-enables unsafe deserialization. Blocked."
tests:
  positive:
    - name: config.json declaring a Lambda layer
      surface: artifact.file
      tool_args:
        module: "keras"
        class_name: "Sequential"
        config:
          layers:
            - {class_name: "InputLayer", config: {batch_shape: [null, 8]}}
            - {class_name: "Lambda", config: {name: "lambda_0"}}
      meta: {filename: config.json}
    - name: config.json re-enabling unsafe deserialization
      surface: artifact.file
      raw: '{"module":"keras","class_name":"Model","enable_unsafe_deserialization":true}'
      meta: {filename: config.json}
  negative:
    - name: ordinary dense/conv config
      surface: artifact.file
      tool_args:
        module: "keras"
        class_name: "Sequential"
        config:
          layers:
            - {class_name: "Dense", config: {units: 64, activation: "relu"}}
            - {class_name: "Conv2D", config: {filters: 32}}
      meta: {filename: config.json}
    - name: unrelated metadata json
      surface: artifact.file
      raw: '{"model_max_length":512,"padding_side":"right"}'
      meta: {filename: tokenizer_config.json}
