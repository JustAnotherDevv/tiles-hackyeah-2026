# injection-defense vocabulary (docs/plan/05-injection-defense.md, INJ-08 / INJ-05 cascade).
# Folded at load time (lowercase, diacritics stripped), so write words naturally.
#
# fuzzy_vocabulary : canonical keywords the `fuzzy` view restores from typoglycemia
#                    ("ignroe" -> "ignore") or small edit distance ("systme" -> "system").
# fuzzy_known_words: real words that are close to a keyword and must never be rewritten.
# imperatives      : verbs used to rank "instruction-like" sentences in long untrusted text.
# agent_words      : words that address an AI agent (sentence ranking).

