<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Aegis architecture: one local gateway on every agent hop</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A808C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3CCB7F"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5BA4F5"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A8CFF"/>
    </marker>
    <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161327"/>
      <stop offset="1" stop-color="#0E1013"/>
    </linearGradient>
    <style>
      .t{fill:#ECEEF1}.t2{fill:#A2A8B3}.t3{fill:#7A808C}
      .h{font-size:22px;font-weight:700}.b{font-size:16px}.s{font-size:14px}.xs{font-size:12.5px}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
      .card{fill:#13161A;stroke:#2A2F37;stroke-width:1.5}
      .pill{stroke-width:1.2}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#07080A"/>

  <!-- title -->
  <text x="40" y="52" class="t h" style="font-size:28px">Aegis: one local gateway on every agent hop</text>
  <text x="40" y="80" class="t2 s">Every request becomes an Interaction, runs one hot-reloaded policy pipeline and ends in allow · log · redact · require_approval · block</text>

  <!-- trust boundary -->
  <rect x="300" y="110" width="860" height="660" rx="18" fill="none" stroke="#3CCB7F" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="318" y="136" fill="#3CCB7F" class="s" font-weight="600">LOCAL MACHINE = TRUST BOUNDARY (raw data allowed inside)</text>

  <!-- clients -->
  <text x="40" y="140" class="t3 xs" font-weight="700" letter-spacing="1.5">CLIENTS</text>
  <rect x="40" y="152" width="230" height="104" rx="12" class="card"/>
  <text x="58" y="182" class="t b" font-weight="700">Claude Code</text>
  <text x="58" y="205" class="t2 xs">ANTHROPIC_BASE_URL</text>
  <text x="58" y="224" class="t2 xs">PreToolUse hook (fail-closed)</text>
  <text x="58" y="243" class="t2 xs">MCP via /mcp/{server}</text>

  <rect x="40" y="272" width="230" height="104" rx="12" class="card"/>
  <text x="58" y="302" class="t b" font-weight="700">Agents (aegis.sdk)</text>
  <text x="58" y="325" class="t2 xs">trading-copilot · research-agent</text>
  <text x="58" y="344" class="t2 xs">chaos-agent · any OpenAI /</text>
  <text x="58" y="363" class="t2 xs">Anthropic / Ollama client</text>

  <rect x="40" y="392" width="230" height="84" rx="12" class="card"/>
  <text x="58" y="422" class="t b" font-weight="700">Apps &amp; tests</text>
  <text x="58" y="445" class="t2 xs">POST /v1/guard (dry run)</text>
  <text x="58" y="464" class="t2 xs">make test · Playground</text>

  <rect x="40" y="492" width="230" height="84" rx="12" class="card"/>
  <text x="58" y="522" class="t b" font-weight="700">Dashboard /ui</text>
  <text x="58" y="545" class="t2 xs">view as owner / admin / member</text>
  <text x="58" y="564" class="t2 xs">/api/* + SSE /api/events</text>

  <!-- arrows clients -> gateway -->
  <line x1="270" y1="204" x2="336" y2="230" stroke="#7A808C" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="270" y1="324" x2="336" y2="300" stroke="#7A808C" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="270" y1="434" x2="336" y2="370" stroke="#7A808C" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="270" y1="534" x2="336" y2="534" stroke="#9A8CFF" stroke-width="2" marker-end="url(#arrI)" marker-start="url(#arrI)"/>

  <!-- gateway -->
  <rect x="340" y="156" width="560" height="440" rx="16" fill="url(#gw)" stroke="#6D5DFC" stroke-width="2"/>
  <text x="362" y="190" class="t h">Aegis gateway</text>
  <text x="530" y="190" class="t2 s mono">127.0.0.1:8787 · Python 3.13 · FastAPI</text>

  <!-- surfaces -->
  <rect x="362" y="202" width="516" height="78" rx="10" fill="#0E1013" stroke="#2A2F37"/>
  <text x="378" y="222" class="t3 xs" font-weight="700" letter-spacing="1.2">SURFACES</text>
  <text x="378" y="246" class="t2 xs mono">/v1/messages · /v1/chat/completions · /ollama/*</text>
  <text x="378" y="267" class="t2 xs mono">/v1/hooks/claude-code · /mcp/{server} · /egress · /v1/guard</text>

  <!-- pipeline -->
  <text x="378" y="298" class="t3 xs" font-weight="700" letter-spacing="1.2">PIPELINE (one policy snapshot per request)</text>
  <g class="xs">
    <rect x="362" y="306" width="116" height="40" rx="8" fill="#191C21" stroke="#2A2F37"/><text x="420" y="331" text-anchor="middle" class="t">identify</text>
    <rect x="488" y="306" width="116" height="40" rx="8" fill="#191C21" stroke="#2A2F37"/><text x="546" y="331" text-anchor="middle" class="t">normalize</text>
    <rect x="614" y="306" width="128" height="40" rx="8" fill="#191C21" stroke="#2A2F37"/><text x="678" y="331" text-anchor="middle" class="t">deterministic</text>
    <rect x="752" y="306" width="126" height="40" rx="8" fill="#191C21" stroke="#2A2F37"/><text x="815" y="331" text-anchor="middle" class="t">semantic</text>
    <rect x="362" y="356" width="116" height="40" rx="8" fill="#191C21" stroke="#2A2F37"/><text x="420" y="381" text-anchor="middle" class="t">combine</text>
    <rect x="488" y="356" width="116" height="40" rx="8" fill="#191C21" stroke="#2A2F37"/><text x="546" y="381" text-anchor="middle" class="t">budgets</text>
    <rect x="614" y="356" width="128" height="40" rx="8" fill="#191C21" stroke="#2A2F37"/><text x="678" y="381" text-anchor="middle" class="t">approvals</text>
    <rect x="752" y="356" width="126" height="40" rx="8" fill="#191C21" stroke="#2A2F37"/><text x="815" y="381" text-anchor="middle" class="t">redact · audit</text>
  </g>

  <!-- decisions -->
  <text x="378" y="424" class="t3 xs" font-weight="700" letter-spacing="1.2">DECISION (most restrictive wins)</text>
  <g class="xs" font-weight="600">
    <rect x="362" y="434" width="84" height="28" rx="14" fill="rgba(60,203,127,0.12)" stroke="#3CCB7F" class="pill"/><text x="404" y="453" text-anchor="middle" fill="#3CCB7F">allow</text>
    <rect x="454" y="434" width="70" height="28" rx="14" fill="rgba(140,147,160,0.12)" stroke="#8C93A0" class="pill"/><text x="489" y="453" text-anchor="middle" fill="#A2A8B3">log</text>
    <rect x="532" y="434" width="90" height="28" rx="14" fill="rgba(91,164,245,0.12)" stroke="#5BA4F5" class="pill"/><text x="577" y="453" text-anchor="middle" fill="#5BA4F5">redact</text>
    <rect x="630" y="434" width="160" height="28" rx="14" fill="rgba(232,169,58,0.12)" stroke="#E8A93A" class="pill"/><text x="710" y="453" text-anchor="middle" fill="#E8A93A">require_approval</text>
    <rect x="798" y="434" width="80" height="28" rx="14" fill="rgba(242,85,111,0.12)" stroke="#F2556F" class="pill"/><text x="838" y="453" text-anchor="middle" fill="#F2556F">block</text>
  </g>

  <!-- controls -->
  <text x="378" y="492" class="t3 xs" font-weight="700" letter-spacing="1.2">39 CONTROLS (auto-discovered, configured in config/policy.yaml)</text>
  <text x="378" y="516" class="t2 xs mono">DLP-01..08 redaction · metadata · exfil   INJ-01..05 injection</text>
  <text x="378" y="536" class="t2 xs mono">ACT-01..04 · EXE-01..03 action guards    BUD-01/02 · EXE-04 budgets</text>
  <text x="378" y="556" class="t2 xs mono">GOV-01..06 identity · models · approvals  MCP-01..04 pinning</text>
  <text x="378" y="576" class="t2 xs mono">SIG-01..03 signed feed signatures         CUS-01 customer rules</text>

  <!-- local side boxes -->
  <rect x="340" y="616" width="170" height="136" rx="12" class="card"/>
  <text x="358" y="644" class="t b" font-weight="700">Token vault</text>
  <text x="358" y="668" class="t2 xs">per session, in RAM</text>
  <text x="358" y="687" class="t2 xs mono">[PESEL_1] [IBAN_1]</text>
  <text x="358" y="706" class="t2 xs">rehydrate for the local</text>
  <text x="358" y="725" class="t2 xs">user only · CVV dropped</text>

  <rect x="522" y="616" width="190" height="136" rx="12" class="card"/>
  <text x="540" y="644" class="t b" font-weight="700">Ollama :11434</text>
  <text x="540" y="668" class="t2 xs">aegis-guard · aegis-judge</text>
  <text x="540" y="687" class="t2 xs">Qwen3Guard · local agents</text>
  <text x="540" y="706" class="t2 xs">+ ONNX NER · classifier</text>
  <text x="540" y="725" class="t2 xs">down → heuristic, degraded</text>

  <rect x="724" y="616" width="176" height="136" rx="12" class="card"/>
  <text x="740" y="644" class="t b" font-weight="700">State (data/)</text>
  <text x="740" y="668" class="t2 xs">SQLite: org, approvals,</text>
  <text x="740" y="687" class="t2 xs">budgets, decisions</text>
  <text x="740" y="706" class="t2 xs">hash-chained audit log</text>
  <text x="740" y="725" class="t2 xs">export JSONL/CSV/OCSF</text>

  <!-- control plane inside boundary -->
  <rect x="925" y="156" width="215" height="196" rx="12" class="card"/>
  <text x="943" y="186" class="t b" font-weight="700">config/policy.yaml</text>
  <text x="943" y="210" class="t2 xs">controls · thresholds</text>
  <text x="943" y="229" class="t2 xs">destination matrix · models</text>
  <text x="943" y="248" class="t2 xs">budgets · approval rules</text>
  <text x="943" y="267" class="t2 xs">4 strictness profiles</text>
  <text x="943" y="296" fill="#9A8CFF" class="xs">save → validate → self-test</text>
  <text x="943" y="315" fill="#9A8CFF" class="xs">→ atomic swap (~1 s)</text>
  <text x="943" y="334" fill="#9A8CFF" class="xs">bad edit → last-good kept</text>
  <line x1="925" y1="254" x2="904" y2="254" stroke="#9A8CFF" stroke-width="2" marker-end="url(#arrI)"/>

  <rect x="925" y="372" width="215" height="122" rx="12" class="card"/>
  <text x="943" y="402" class="t b" font-weight="700">Mocks :8791-8794</text>
  <text x="943" y="426" class="t2 xs">mock_llm · mock_mcp</text>
  <text x="943" y="445" class="t2 xs">mock_saas · exfil_sink</text>
  <text x="943" y="464" fill="#3CCB7F" class="xs" font-weight="600">"Attacker received: 0"</text>
  <line x1="904" y1="430" x2="921" y2="430" stroke="#7A808C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- feed service (external) -->
  <rect x="1200" y="560" width="360" height="150" rx="12" fill="#13161A" stroke="#9A8CFF" stroke-width="1.5"/>
  <text x="1218" y="590" class="t b" font-weight="700">Threat-intel feed service :8790</text>
  <text x="1218" y="614" class="t2 xs">externally managed signature bundles</text>
  <text x="1218" y="633" class="t2 xs">Ed25519-signed · monotonic serial (anti-rollback)</text>
  <text x="1218" y="652" class="t2 xs">inline test vectors · editor UI · Publish / Tamper</text>
  <text x="1218" y="680" fill="#9A8CFF" class="xs">gateway holds only the public key</text>
  <path d="M1200 600 H1020 V540 H906" fill="none" stroke="#9A8CFF" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrI)"/>
  <text x="912" y="566" fill="#9A8CFF" class="xs">signed bundle (SSE + poll)</text>

  <!-- remote side -->
  <text x="1200" y="140" class="t3 xs" font-weight="700" letter-spacing="1.5">OUTSIDE THE BOUNDARY</text>
  <rect x="1200" y="152" width="360" height="118" rx="12" class="card"/>
  <text x="1218" y="182" class="t b" font-weight="700">Remote LLM APIs</text>
  <text x="1218" y="206" class="t2 xs">Anthropic · OpenAI · OpenRouter (when keys exist)</text>
  <text x="1218" y="225" class="t2 xs">CONFIDENTIAL → tokenized · SECRET → blocked</text>
  <text x="1218" y="248" fill="#5BA4F5" class="xs" font-weight="600">sees [PERSON_1] [PESEL_1] [IBAN_1] [PAN_1] only</text>

  <rect x="1200" y="290" width="360" height="118" rx="12" class="card"/>
  <text x="1218" y="320" class="t b" font-weight="700">Third parties</text>
  <text x="1218" y="344" class="t2 xs">remote MCP servers · HTTP APIs (via /egress)</text>
  <text x="1218" y="363" class="t2 xs">tools pinned (rug-pull) · args scanned · spend</text>
  <text x="1218" y="382" class="t2 xs">and sends held for the right approver</text>

  <path d="M900 362 H1172 V212 H1194" fill="none" stroke="#5BA4F5" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrB)"/>
  <path d="M1172 350 H1194" fill="none" stroke="#5BA4F5" stroke-width="4" marker-end="url(#arrB)"/>
  <text x="1210" y="440" fill="#5BA4F5" class="s" font-weight="700">placeholders only cross the boundary</text>
  <text x="1210" y="462" class="t2 xs">responses are scanned (leaks, md-image exfil,</text>
  <text x="1210" y="481" class="t2 xs">canaries) and rehydrated only for the local user</text>

  <!-- footer -->
  <text x="40" y="820" class="t2 s">Hybrid guardrails: deterministic first (checksums, secrets, command/SSRF, MCP pinning, signatures), small local models second, never authorizing.</text>
  <text x="40" y="846" class="t2 s">Budgets org → team → agent → session (tokens, USD, local compute-s) · loop detector · kill switch · approvals routed by role, action and amount.</text>
  <text x="40" y="872" class="t3 xs">Ports: gateway 8787 · feed 8790 · mock_llm 8791 · mock_mcp 8792 · exfil_sink 8793 · mock_saas 8794 · Ollama 11434</text>
</svg>
