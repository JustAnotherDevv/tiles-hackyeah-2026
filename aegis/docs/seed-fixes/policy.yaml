    acme-db:     {transport: http, url: "http://127.0.0.1:8792/mcp/acme-db",     destination: local,       description: "Acme prod/staging databases (mock SQLite)"}
    acme-crm:    {transport: http, url: "http://127.0.0.1:8792/mcp/acme-crm",    destination: local,       description: "Internal CRM"}
    marketpulse: {transport: http, url: "http://127.0.0.1:8792/mcp/marketpulse", destination: third_party, description: "Market-data SaaS (approved vendor)"}
    payments:    {transport: http, url: "http://127.0.0.1:8792/mcp/payments",    destination: third_party, description: "Payments ($12 / $480 / $1,500 spend flows)"}
    mailer:      {transport: http, url: "http://127.0.0.1:8792/mcp/mailer",      destination: third_party, description: "Outbound email"}
    web:         {transport: http, url: "http://127.0.0.1:8792/mcp/web",         destination: third_party, description: "Web fetch (pages carry hidden indirect injection)"}
    weather:     {transport: http, url: "http://127.0.0.1:8792/mcp/weather",     destination: third_party, description: "Benign demo tools"}
    poisoned:    {transport: http, url: "http://127.0.0.1:8792/mcp/poisoned",    destination: third_party, description: "Tool-poisoning demo (MCP-02)"}
    rugpull:     {transport: http, url: "http://127.0.0.1:8792/mcp/rugpull",     destination: third_party, description: "Rug-pull demo (MCP-03)"}
  unknown_server_action: block
  on_tool_change: block
