       expect: {required_role: admin, rule: tool-approve, approvers_not_ok: [u_tomasz]}}
    - {name: unknown-db-sensitivity-fails-closed, request: {kind: action, action_type: db.read, requester: claude-code@platform, resource: "db:mystery_table"},
       expect: {required_role: admin, rule: null}}
