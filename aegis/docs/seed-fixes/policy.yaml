# =============================================================================
#  Aegis - control catalog (CORRECTED SEED, config-ready)          Acme Capital
#  docs/seed-fixes/policy.yaml - written by synth-A, Sat 3 Oct 2026 night
# =============================================================================
#
#  WHAT THIS IS
#    A complete config/policy.yaml in CONTRACT format (validates against the
#    frozen PolicyDoc, CONTRACTS §4.2): the §4.3 example + one entry per catalog
#    control (§4.4 + GOV-06 from Addendum A) + the corrected `approvals:` section
#    (identical to docs/seed-fixes/approvals.yaml) + the seed fixes below.
#    It replaces staging/seed/policy.yaml (staging vocabulary, not loadable).
#
#  WHO APPLIES IT (Addendum A, "Seed fixes")
#    policy-engine: start config/policy.yaml + config/policy.golden.yaml from this
#    file, then merge config/snippets/<workstream>.yaml on top:
#      * controls[id=X].params: deep-merge, snippet wins EXCEPT keys tagged [SF-..]
#      * controls[id=X].tests / top-level tests: append, dedupe by name
#      * actions: action-guards' snippet list replaces this list only if it keeps
#        the egress rules and the email.external apex pattern below
#      * approvals: keep this block (approvals-engine's snippet must equal it)
#    Port staged comments/descriptions freely; never port staged 2-20 ms
#    deterministic timeouts [SF-11] (schema default 250 ms is used here).
#    Controls work with defaults when params keys are missing (CONTRACTS §2.3):
#    params below are only the binding knobs, fixes and demo levers.
#
#  FIXES (see Addendum A "Seed fixes" for the bug each one closes)
#    [SF-04] destinations.matrix CONFIDENTIAL.third_party = redact (was block) +
#            DLP-01 params.routing_args: recipient args of send tools are routing
#            data governed by ACT-03, never redacted/blocked by DLP-01
#    [SF-05] INJ-01 never blocks on mcp.list (untrusted -> redact); MCP-02 owns
#            dropping a poisoned tool; its inline test is control-attributed
#    [SF-06] allowed_link_domains += assets.acme-capital.example (EchoLeak
#            AEGIS-TI-022 demo host) + assets.aegis-corp.example (staged alias)
#    [SF-07] internal_domains includes the apex acme-capital.example (emails
#            to x@acme-capital.example are internal for ACT-03 / DLP-03)
#    [SF-11] no staged 2-20 ms timeouts for deterministic controls
#    [SF-18] severity critical: DLP-02, EXE-01, SIG-01, SIG-02 (F5: disabling
#            DLP-02 routes to the owner via rule disable-control-critical)
#    [SF-19] EXE-02 fs_deny protects the Claude Code harness files
#    [SF-22] INJ-02 threshold 0.80, timeout 700 ms (staging measurements)
#    [SF-26] GOV-06 harness integrity control (claude-code-integration)
#    [SF-02]/[SF-04] regression tests: the $12 / $480 spend flows and an
#            external email must reach require_approval, not a GOV-03/DLP-01 block
# =============================================================================

version: 1
metadata:
  name: acme-capital-default
  description: "Default control catalog for Acme Capital (demo)"
  owner: u_marek
profile: balanced                       # permissive | balanced | strict | paranoid (config/profiles/*.yaml)

defaults:
  mode: enforce
  fail_mode: closed
  semantic_timeout_ms: 400
  stream_mode: buffered
  block_response: message               # model proxies answer with a synthetic "[Aegis] Blocked by ..." reply
  require_auth: false                   # demo: identity may come from X-Aegis-* headers
  audit_content: false
  rehydrate_responses: true
  max_body_bytes: 8000000
  selftest_gate: enforce                # extra (Addendum A-28): enforce | warn | off

destinations:
  matrix:                               # data class x destination -> action (DLP-01/02/03/07); judges edit cells live
    PUBLIC:       {local: allow,  remote: allow,  third_party: allow}
    INTERNAL:     {local: allow,  remote: redact, third_party: redact}   # acted on by DLP-03 (metadata-egress)
    CONFIDENTIAL: {local: allow,  remote: redact, third_party: redact}   # [SF-04] tokenize, don't block (strict profile: block)
    RESTRICTED:   {local: redact, remote: redact, third_party: block}    # PAN to WebFetch / a third-party tool -> block
    SECRET:       {local: log,    remote: block,  third_party: block}
  local_tools: [Read, Write, Edit, MultiEdit, Glob, Grep, LS, NotebookEdit, Bash, TodoWrite]
  third_party_tools: [WebFetch, WebSearch]
  internal_domains: ["acme-capital.example", "*.acme-capital.example", "*.corp.local", "*.internal", "*.acme.test"]   # [SF-07]
  allowed_link_domains: ["docs.acme-capital.example", "assets.acme-capital.example", "assets.aegis-corp.example"]   # [SF-06]
  egress_allowlist: []                  # empty = rely on controls

providers:
  anthropic:        {wire: anthropic, base_url: "https://api.anthropic.com", destination: remote, passthrough_auth: true}
  openai:           {wire: openai, base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY, enabled_if_env: OPENAI_API_KEY}
  openrouter:       {wire: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, enabled_if_env: OPENROUTER_API_KEY}
  ollama:           {wire: ollama, base_url: "http://127.0.0.1:11434", destination: local}
  ollama-openai:    {wire: openai, base_url: "http://127.0.0.1:11434/v1", destination: local}
  ollama-anthropic: {wire: anthropic, base_url: "http://127.0.0.1:11434", destination: local}
  # Mock ports: env override via ${AEGIS_MOCK_LLM_PORT:-8791} is optional (Addendum A-55);
  # literal default ports are used here so the file works without expansion.
  mock-anthropic:   {wire: anthropic, base_url: "http://127.0.0.1:8791", destination: remote}
  mock-openai:      {wire: openai, base_url: "http://127.0.0.1:8791/v1", destination: remote}

models:
  allowed: ["claude-*", "gpt-4.1-mini", "meta-llama/*", "aegis-judge*", "qwen*", "hf.co/*", "mock-*"]
  denied: ["*:cloud", "aegis-guard*"]   # cloud models are external; the guard model is not a chat model
  routes:                               # first match wins; `wire` filters by the API the client used (no cross-wire translation)
    - {match: "mock-*",       provider: mock-anthropic, wire: anthropic}
    - {match: "mock-*",       provider: mock-openai,    wire: openai}
    - {match: "claude-*",     provider: anthropic}
    - {match: "gpt-*",        provider: openai}
    - {match: "meta-llama/*", provider: openrouter}
    - {match: "*",            provider: ollama-openai,    wire: openai}      # local: aegis-judge, qwen*, hf.co/*
    - {match: "*",            provider: ollama,           wire: ollama}
    - {match: "*",            provider: ollama-anthropic, wire: anthropic}   # Claude Code offline fallback (slow)
  downgrade:
    - {from: "claude-opus-*",   to: "claude-sonnet-4-5"}
    - {from: "claude-sonnet-*", to: "claude-haiku-4-5"}
    - {from: "*",               to: "aegis-judge"}
  default_local: "aegis-judge"

budgets:                                # amounts = config/org.seed.yaml `budgets:` reference values
  defaults: {soft_pct: 80, on_soft: downgrade, on_hard: block, local_concurrency: 1, max_output_tokens: 4096}
  timezone: Europe/Warsaw               # extra (Addendum A-34): calendar windows
  limits:
    - {scope: "org:acme-capital",              window: day,     usd: 150, compute_s: 14400}
    - {scope: "org:acme-capital",              window: month,   usd: 3000, spend_usd: 10000}
    - {scope: "team:trading",                  window: day,     usd: 60, tokens: 4000000}
    - {scope: "team:trading",                  window: month,   usd: 1200, spend_usd: 2000}
    - {scope: "team:research",                 window: day,     usd: 15, compute_s: 7200}
    - {scope: "team:platform",                 window: day,     usd: 50}
    - {scope: "member:*",                      window: day,     usd: 5}          # each human member (playground)
    - {scope: "agent:claude-code@platform",    window: day,     usd: 30}
    - {scope: "agent:trading-copilot@trading", window: day,     usd: 20}
    - {scope: "agent:research-agent@research", window: day,     compute_s: 5400}
    - {scope: "agent:chaos-agent@platform",    window: day,     usd: 0.50, tokens: 100000, on_hard: require_approval}   # F6
    - {scope: "session:*",                     window: session, usd: 5.0, tokens: 3000000}
  loops: {repeat: 3, window: 20, cycle_k: 3, error_streak: 5, max_steps_per_session: 200, ladder: [tool_error, block, kill]}
  rate: {requests_per_min: 120, tool_calls_per_min: 60}
  kill_switch: {global: false, teams: [], members: [], agents: [], sessions: []}

actions:                                # shared classification (aegis.actions.classify); ORDER MATTERS, first match wins
  # --- spend (ACT-01): MCP / tool calls
  - {id: spend.subscription, category: spend, tools: ["marketpulse.purchase_subscription", "*.purchase_subscription", "*.subscribe"],
     amount_arg: amount_usd, resource_arg: vendor, resource_prefix: "vendor:", title: "{agent} wants to spend ${amount} on {args.vendor} {args.plan}"}
  - {id: spend.charge, category: spend, tools: ["payments.create_charge", "*.create_charge", "*.checkout*", "*.top_up*", "*.purchase*"],
     amount_arg: amount_usd, resource_arg: vendor, resource_prefix: "vendor:", title: "{agent} wants to pay ${amount} to {args.vendor}"}
  - {id: spend.transfer, category: spend, tools: ["*.transfer_funds", "*.wire_transfer", "*.send_payment", "payments.transfer*"],
     amount_arg: amount_usd, title: "{agent} wants to transfer ${amount}"}
  # --- spend via /egress to the mock payments API (Addendum A-13: tool_args = {method, url, json, body})
  - {id: spend.subscription, category: spend, surfaces: [egress.request], url_hosts: ["pay.saas.test"],
     args_match: {"method": "^POST$", "url": "/payments/subscriptions"}, amount_arg: json.amount_usd, resource_arg: json.vendor, resource_prefix: "vendor:"}
  - {id: spend.charge, category: spend, surfaces: [egress.request], url_hosts: ["pay.saas.test"],
     args_match: {"method": "^POST$", "url": "/payments/charges"}, amount_arg: json.amount_usd, resource_arg: json.vendor, resource_prefix: "vendor:"}
  # --- data (ACT-02 refines sensitivity/env labels from rt.org.resources())
  - {id: db.schema, category: data_write, tools: ["acme-db.query", "*.query_sql", "*.run_sql", "sql.*"],
     args_match: {sql: "(?i)^\\s*(drop|alter|truncate|create|grant|revoke|rename)\\b"},
     resource_arg: sql, resource_regex: "(?i)\\b(?:table|into|from)\\s+([a-z_][a-z0-9_\\.]*)", resource_prefix: "db:"}
  - {id: db.write, category: data_write, tools: ["acme-db.query", "*.query_sql", "*.run_sql", "sql.*"],
     args_match: {sql: "(?i)^\\s*(insert|update|delete|merge|replace|upsert|copy)\\b"},
     resource_arg: sql, resource_regex: "(?i)\\b(?:into|update|from|table)\\s+([a-z_][a-z0-9_\\.]*)", resource_prefix: "db:"}
  - {id: db.read, category: data_read, tools: ["acme-db.query", "*.query_sql", "*.run_sql", "sql.*"],
     resource_arg: sql, resource_regex: "(?i)\\bfrom\\s+([a-z_][a-z0-9_\\.]*)", resource_prefix: "db:"}
  # --- external send (ACT-03); recipient subdomains of the firm count as internal [SF-07]
  - {id: email.external, category: external_send, tools: ["mailer.send_email", "*.send_email"], args_match: {to: "@"},
     args_not_match: {to: "(?i)@([a-z0-9-]+\\.)*acme-capital\\.example\\s*$"}, title: "{agent} wants to email {args.to}"}
  - {id: email.internal, category: other, tools: ["mailer.send_email", "*.send_email"]}
  - {id: egress.post, category: external_send, surfaces: [egress.request], args_match: {"method": "^(POST|PUT|PATCH)$"}}
  - {id: egress.post, category: external_send, tools: ["*.post_message", "*.upload*", "*.webhook*", "slack.*"]}
  - {id: egress.get, category: other, tools: ["WebFetch", "web.fetch_url"]}
  - {id: egress.get, category: other, surfaces: [egress.request]}
  # --- code (ACT-04 / SIG-03); SIG-03 owns approval of unknown packages, ACT-04 logs package.install in balanced
  - {id: code.deploy, category: code_exec, tools: ["Bash"],
     args_match: {command: "(?i)\\b(terraform\\s+(apply|destroy)|kubectl\\s+(apply|delete|rollout|scale)|helm\\s+(install|upgrade|uninstall)|git\\s+push\\b)"}}
  - {id: package.install, category: code_exec, tools: ["Bash"],
     args_match: {command: "(?i)\\b(pip3?|uv\\s+pip|uv|poetry|npm|pnpm|yarn|brew|apt(-get)?|gem|cargo|go)\\s+(install|add|i)\\b"}}
  - {id: code.exec, category: code_exec, tools: ["Bash"],
     args_match: {command: "(?i)\\b((docker|podman)\\s+run|ssh|scp|rsync|python3?\\s+-c|node\\s+-e)\\b"}}

# ---------------------------------------------------------------------------
# approvals: BEGIN - byte-identical copy of docs/seed-fixes/approvals.yaml
# ---------------------------------------------------------------------------
approvals:
  defaults:
    ttl_s: 900                       # pending TTL; expired => denied semantics
    on_timeout: deny
    max_pending: 50
    default_approver: admin          # action | budget_raise | mcp_pin matching no rule (fail closed)
    default_config_approver: owner   # config_change matching no rule (fail closed) [SF-10]
    hold_s: {hook: 60, mcp: 30, egress: 15, guard: 0, proxy: 0, playground: 0, dashboard: 0}
    # --- approvals-engine extras (whitelisted, Addendum A-34) ---
    grant_ttl_s: 900                 # how long an approval can be redeemed after it is given
    max_pending_per_principal: 10    # anti human-in-the-loop flooding (ASI09 / T10)
    redeem_window_s: 30              # hook + MCP proxy redeeming the same call count as one use
    deny_cooldown_s: 60              # identical call just denied -> same denied request, no new card
    sweep_interval_s: 1
    clock_multiplier: 1              # demo: 60 => TTL minutes behave like seconds (could)

  # ---------------------------------------------------------------------------
  # Agent actions, budget overrides, MCP re-pins, org changes. FIRST MATCH WINS.
  # ---------------------------------------------------------------------------
  rules:
    # --- org governance (org-rbac: create_manual, kind=action, action_type=org.*) [SF-23]
    - {id: org-owner-grants, description: "Granting or revoking the owner role always needs an owner",
       when: {kind: [action], action: ["org.role.promote_owner", "org.role.demote_owner", "org.member.create_owner"]}, approver: owner, ttl_s: 3600}
    - {id: org-privileged, description: "Promote/demote admins, add an admin, deactivate an admin/owner, widen an agent's destination",
       when: {kind: [action], action: ["org.role.*", "org.member.create_admin", "org.member.deactivate_privileged", "org.agent.widen_destination"]}, approver: owner, ttl_s: 3600}
    - {id: org-routine, description: "Routine member/agent administration (admins apply these directly)",
       when: {kind: [action], action: ["org.member.*", "org.agent.*"]}, approver: admin}

    # --- spend (ACT-01): <= $20 self | <= $200 admin | > $200 owner | > $1,000 owner + admin
    #     above ACT-01 hard_block_above_usd ($5,000 balanced) a call is blocked and never gets here
    - {id: spend-owner-2p, aliases: [APR-SPEND-TWO-PERSON], description: "Over $1,000: owner plus a second admin (two-person rule)",
       when: {action: ["spend.*"], amount_usd_gt: 1000}, approver: owner, two_person: true, ttl_s: 7200}
    - {id: spend-owner, aliases: [APR-SPEND-OWNER], description: "Over $200 (e.g. the $480 GPU reservation)",
       when: {action: ["spend.*"], amount_usd_gt: 200}, approver: owner}
    - {id: spend-strict-vendor, aliases: [APR-SPEND-STRICT-UNAPPROVED-VENDOR], description: "Strict: vendor not on the approved list",
       when: {action: ["spend.*"], profiles: [strict, paranoid], labels: {vendor_approved: "false"}}, approver: admin}
    - {id: spend-strict-recurring, aliases: [APR-SPEND-STRICT-RECURRING], description: "Strict: every new subscription",
       when: {action: ["spend.*"], profiles: [strict, paranoid], labels_in: {recurring: [monthly, yearly]}}, approver: admin}
    - {id: spend-admin, aliases: [APR-SPEND-ADMIN], description: "$20.01-$200 (e.g. the $50/month MarketPulse Pro subscription)",
       when: {action: ["spend.*"], amount_usd_gt: 20}, approver: admin}
    - {id: spend-self, aliases: [APR-SPEND-SELF], description: "Up to $20: the member (or the agent's sponsor) confirms",
       when: {action: ["spend.*"]}, approver: self, grant_ttl_s: 600}

    # --- data access (ACT-02): table sensitivity + environment labels
    - {id: db-restricted, aliases: [APR-DATA-RESTRICTED], description: "PCI: no agent may read raw card data, whoever approves",
       when: {action: ["db.*"], labels_in: {sensitivity: [RESTRICTED, SECRET]}}, approver: deny}
    - {id: db-prod-ddl, aliases: [APR-DATA-PROD-DDL], description: "Schema changes on prod go through migrations, never an agent",
       when: {action: ["db.schema"], labels: {env: prod}}, approver: deny}
    - {id: db-prod-bulk-delete-strict, aliases: [APR-DATA-PROD-BULK-DELETE], description: "Strict: unbounded prod DELETE/UPDATE needs owner + admin [SF-08]",
       when: {action: ["db.write"], profiles: [strict, paranoid], labels: {env: prod, bulk: "true"}}, approver: owner, two_person: true}
    - {id: db-prod-write, aliases: [APR-DATA-PROD-WRITE], description: "Any agent write to a production database",
       when: {action: ["db.write"], labels: {env: prod}}, approver: owner, grant_ttl_s: 600}
    - {id: db-staging-write, aliases: [APR-DATA-STAGING-WRITE],
       when: {action: ["db.write"], labels: {env: staging}}, approver: self}
    - {id: db-write, description: "Writes/DDL outside prod/staging labels (fail closed)",
       when: {action: ["db.write", "db.schema"]}, approver: admin}
    - {id: db-pii-read, aliases: [APR-DATA-CONFIDENTIAL-READ], description: "E.g. SELECT * FROM customers (PII); rows still pass DLP before a remote model sees them",
       when: {action: ["db.read"], labels: {sensitivity: CONFIDENTIAL}}, approver: admin, grant_ttl_s: 3600}
    - {id: db-internal-read, aliases: [APR-DATA-INTERNAL-READ],
       when: {action: ["db.read"], profiles: [strict, balanced], labels: {sensitivity: INTERNAL}}, approver: self, grant_ttl_s: 3600}
    - {id: db-read, aliases: [APR-DATA-PUBLIC-READ, APR-DATA-INTERNAL-READ-PERMISSIVE], description: "Public data (unknown sensitivity falls through to admin)",
       when: {action: ["db.read"], labels_in: {sensitivity: [PUBLIC, INTERNAL]}}, approver: auto}

    # --- external send (ACT-03, EXE-03): data class in the payload + signals
    - {id: send-restricted, aliases: [APR-SEND-EXTERNAL-RESTRICTED], description: "Card data or secrets to a third party: never",
       when: {action: ["email.external", "egress.post"], labels_in: {data_class: [RESTRICTED, SECRET]}}, approver: deny}
    - {id: send-tainted, aliases: [APR-SEND-TAINTED], description: "Session read private data AND saw untrusted content (lethal trifecta)",
       when: {action: ["email.*", "egress.post"], signals_any: [lethal_trifecta]}, approver: admin}
    - {id: send-peer, aliases: [APR-SEND-PEER-INITIATED], description: "A peer agent asked us to send (inert until A2A)",
       when: {action: ["email.*", "egress.post"], signals_any: [peer_initiated]}, approver: admin}
    - {id: send-confidential, aliases: [APR-SEND-EXTERNAL-CONFIDENTIAL], description: "Client data (even tokenized) leaving the firm",
       when: {action: ["email.external", "egress.post"], labels: {data_class: CONFIDENTIAL}}, approver: admin}
    - {id: send-bulk, aliases: [APR-SEND-BULK],
       when: {action: ["email.external"], labels: {bulk: "true"}}, approver: admin}
    - {id: send-internal, aliases: [APR-SEND-INTERNAL],
       when: {action: ["email.internal"]}, approver: auto}
    - {id: external-send-permissive, aliases: [APR-SEND-EXTERNAL-PUBLIC-PERMISSIVE],
       when: {action: ["email.external", "egress.post"], profiles: [permissive]}, approver: auto}
    - {id: external-send, aliases: [APR-SEND-EXTERNAL-PUBLIC],
       when: {action: ["email.external", "egress.post"]}, approver: self}

    # --- code execution & packages (ACT-04, SIG-03, EXE-01)
    - {id: pkg-unknown, aliases: [APR-EXEC-PKG-UNKNOWN], description: "Possible slopsquatting (SIG-03 signal unknown_package)",
       when: {action: ["package.install"], signals_any: [unknown_package]}, approver: admin}
    - {id: code-exec-strict, aliases: [APR-EXEC-STRICT],
       when: {action: ["package.install", "code.exec"], profiles: [strict, paranoid]}, approver: admin}
    - {id: code-exec-remote-shell, aliases: [APR-EXEC-REMOTE-SHELL],
       when: {action: ["code.exec"], labels: {pattern: remote_shell}}, approver: admin}
    - {id: code-exec-unsandboxed, aliases: [APR-EXEC-UNSANDBOXED],
       when: {action: ["code.exec"], labels: {sandboxed: "false"}}, approver: admin}
    - {id: code-exec-sandboxed, aliases: [APR-EXEC-SANDBOXED],
       when: {action: ["code.exec"], labels: {sandboxed: "true"}}, approver: self}
    - {id: pkg-install-permissive, aliases: [APR-EXEC-PKG-KNOWN-PERMISSIVE],
       when: {action: ["package.install"], profiles: [permissive]}, approver: auto}
    - {id: pkg-install, aliases: [APR-EXEC-PKG-KNOWN],
       when: {action: ["package.install"]}, approver: self}
    - {id: code-exec, description: "code.exec without a sandbox label (fail closed)",
       when: {action: ["code.exec"]}, approver: admin}

    # --- deploy (ACT-04): env label prod | mainline | staging | dev
    - {id: deploy-prod-strict, aliases: [APR-DEPLOY-PROD-STRICT],
       when: {action: ["code.deploy"], profiles: [strict, paranoid], labels: {env: prod}}, approver: owner, two_person: true}
    - {id: deploy-prod, aliases: [APR-DEPLOY-PROD],
       when: {action: ["code.deploy"], labels: {env: prod}}, approver: owner, grant_ttl_s: 600}
    - {id: deploy-mainline, aliases: [APR-DEPLOY-MAINLINE], description: "Push to main/release (stands in for code review)",
       when: {action: ["code.deploy"], labels: {env: mainline}}, approver: admin}
    - {id: deploy-staging, aliases: [APR-DEPLOY-STAGING],
       when: {action: ["code.deploy"], labels: {env: staging}}, approver: self}
    - {id: deploy-dev, aliases: [APR-DEPLOY-DEV],
       when: {action: ["code.deploy"], labels: {env: dev}}, approver: auto}
    - {id: deploy, when: {action: ["code.deploy"]}, approver: admin}

    # --- other governed actions [SF-24]
    - {id: dlp-release, description: "A judge set a destinations.matrix cell to require_approval (DLP-01)",
       when: {action: ["dlp.release"]}, approver: admin}
    - {id: goal-drift, description: "INJ-05 (stretch): tool call drifts from the user's task",
       when: {action: ["agent.goal_drift"]}, approver: self}
    - {id: tool-approve, description: "GOV-04 generic approve_tools (action_type tool:<server>.<tool>)",
       when: {action: ["tool:*"]}, approver: admin}

    # --- budget overrides from BUD-01 (on_hard: require_approval) and MCP re-pins from MCP-03
    - {id: budget-override, description: "Agent hit a hard budget with on_hard: require_approval (F6)",
       when: {kind: [budget_raise]}, approver: admin}
    - {id: mcp-repin-internal, aliases: [APR-MCP-REAPPROVE-INTERNAL],
       when: {kind: [mcp_pin], labels: {dest: local}}, approver: self}
    - {id: mcp-repin, aliases: [APR-MCP-REAPPROVE-EXTERNAL], description: "Changed/new third-party MCP tool (possible rug pull)",
       when: {kind: [mcp_pin]}, approver: admin}

  # ---------------------------------------------------------------------------
  # Config changes (GOV-05). `action` globs match PolicyChange.kind. Per-change
  # facts usable in `labels`: control_id, control_severity, loosening ("true"/
  # "false"), scope, scope_type, model_dest, provider_new, signature_severity,
  # requester_is_sponsor. FIRST MATCH WINS; multi-change = highest level.
  # ---------------------------------------------------------------------------
  config_rules:
    - {id: approval-rules, description: "Who-may-approve-what is owner territory",
       when: {action: ["approval.rule"]}, approver: owner}
    - {id: protect-more, aliases: [APR-CTRL-ENABLE, APR-POLICY-TIGHTEN], description: "Turning protection ON is always free",
       when: {action: ["control.enable", "control.add", "control.action.tighten", "control.threshold.tighten", "model.disallow"]}, approver: auto}
    - {id: mode-tighten, when: {action: ["control.mode"], labels: {loosening: "false"}}, approver: auto}
    - {id: disable-control-strict, aliases: [APR-CTRL-STRICT], description: "Strict: owner + a second admin",
       when: {action: ["control.disable", "control.remove", "control.mode", "control.action.loosen"], profiles: [strict, paranoid]}, approver: owner, two_person: true, ttl_s: 3600}
    - {id: disable-control-critical, aliases: [APR-CTRL-BALANCED-CRITICAL], description: "Critical controls (DLP-02, EXE-01, SIG-01, SIG-02)",
       when: {action: ["control.disable", "control.remove", "control.mode", "control.action.loosen"], labels: {control_severity: critical}}, approver: owner}
    - {id: disable-control-permissive, aliases: [APR-CTRL-PERMISSIVE],
       when: {action: ["control.disable", "control.remove", "control.mode", "control.action.loosen"], profiles: [permissive]}, approver: self}
    - {id: disable-control, aliases: [APR-CTRL-BALANCED],
       when: {action: ["control.disable", "control.remove", "control.mode", "control.action.loosen"]}, approver: admin}
    - {id: raise-org-2x, aliases: [APR-BUDGET-ORG-OVER-2X],
       when: {action: ["budget.raise"], scope_type: [org], increase_pct_gt: 100}, approver: owner, two_person: true}
    - {id: raise-org, aliases: [APR-BUDGET-ORG],
       when: {action: ["budget.raise"], scope_type: [org]}, approver: owner}
    - {id: raise-large, aliases: [APR-BUDGET-TEAM-OVER-2X], description: "Team budget more than doubled (e.g. 60 -> 150)",
       when: {action: ["budget.raise"], scope_type: [team], increase_pct_gt: 100}, approver: owner}
    - {id: raise-team-small, aliases: [APR-BUDGET-TEAM-2X], description: "Team budget raised up to 2x (e.g. 60 -> 75) [SF-09]",
       when: {action: ["budget.raise"], scope_type: [team]}, approver: admin}
    - {id: raise-agent-large, aliases: [APR-BUDGET-AGENT-LARGE],
       when: {action: ["budget.raise"], scope_type: [member, agent, session], increase_pct_gt: 50}, approver: admin}
    - {id: raise-small, aliases: [APR-BUDGET-AGENT-SMALL], description: "Sponsor gives their own agent up to +50 %",
       when: {action: ["budget.raise"], scope_type: [member, agent, session]}, approver: self}
    - {id: raise-other, when: {action: ["budget.raise", "budget.remove"]}, approver: owner}
    - {id: budget-tighten, when: {action: ["budget.lower", "budget.add"]}, approver: admin}
    - {id: profile-down, aliases: [APR-POLICY-PROFILE-DOWN],
       when: {action: ["profile.change"], labels: {loosening: "true"}}, approver: owner}
    - {id: profile-up, when: {action: ["profile.change"]}, approver: auto}
    - {id: killswitch-release-global, aliases: [APR-KILL-RELEASE-GLOBAL],
       when: {action: ["killswitch.off"], labels: {scope: global}}, approver: owner}
    - {id: loosen-threshold, aliases: [APR-KILL-RELEASE], description: "Loosen a threshold or release a (non-global) kill switch; the sponsor cannot release alone",
       when: {action: ["control.threshold.loosen", "killswitch.off"]}, approver: admin}
    - {id: killswitch-own-agent, aliases: [APR-KILL-ENGAGE], description: "Anyone may pull the brake on an agent they sponsor [SF-16]",
       when: {action: ["killswitch.on"], labels: {requester_is_sponsor: "true"}}, approver: auto}
    - {id: tighten, description: "Kill switch on anything else (incl. global) [SF-16]",
       when: {action: ["killswitch.on"]}, approver: admin}
    - {id: provider-change, when: {action: ["provider.change", "route.change"]}, approver: owner}
    - {id: model-new-provider, aliases: [APR-MODEL-NEW-PROVIDER], description: "A new data processor (DPA / vendor review)",
       when: {action: ["model.allow"], labels: {provider_new: "true"}}, approver: owner}
    - {id: model-allow-local, aliases: [APR-MODEL-LOCAL],
       when: {action: ["model.allow"], labels: {model_dest: local}}, approver: self}
    - {id: model-allow, aliases: [APR-MODEL-REMOTE],
       when: {action: ["model.allow"]}, approver: admin}
    - {id: feed-override-critical, aliases: [APR-FEED-OVERRIDE-CRITICAL],
       when: {action: ["feed.override"], labels: {signature_severity: critical}}, approver: owner}
    - {id: feed-override, aliases: [APR-FEED-OVERRIDE],
       when: {action: ["feed.override"]}, approver: admin}
    - {id: mcp-server-strict, aliases: [APR-MCP-REGISTER-STRICT],
       when: {action: ["mcp.server"], profiles: [strict, paranoid]}, approver: owner}
    - {id: mcp-server, aliases: [APR-MCP-REGISTER],
       when: {action: ["mcp.server"]}, approver: admin}
    - {id: control-params-loosen, when: {action: ["control.params"], labels: {loosening: "true"}}, approver: admin}
    - {id: policy-loosen-strict, aliases: [APR-POLICY-LOOSEN-STRICT],
       when: {profiles: [strict, paranoid], labels: {loosening: "true"}}, approver: owner}
    - {id: policy-loosen, aliases: [APR-POLICY-LOOSEN],
       when: {labels: {loosening: "true"}}, approver: admin}
    - {id: policy-neutral, aliases: [APR-POLICY-NEUTRAL], description: "Descriptions, comments, new examples",
       when: {action: ["control.params", "other"]}, approver: self}

  # ---------------------------------------------------------------------------
  # Routing self-tests (approvals-engine extra `tests`; run by its unit tests and
  # after every policy apply; a failure is a warning, never a rejection).
  # request.requester = member id or agent id from config/org.seed.yaml.
  # approvers_ok: an id = that person alone completes the approval; a [pair] =
  # those two together complete a two-person approval. approvers_not_ok: ids
