# =============================================================================
#  Aegis - demo organization seed: "Acme Capital"   (CORRECTED SEED, config-ready)
#  docs/seed-fixes/org.seed.yaml - written by synth-A, Sat 3 Oct 2026 night
#  org-rbac copies this file to config/org.seed.yaml (CONTRACTS §4.5 + Addendum A).
# =============================================================================
#
#  WHAT THIS FILE IS
#    The initial state of the demo organization: humans, AI agents (service
#    identities), their FAKE API keys, the resource inventory that agent actions
#    touch (databases/tables with sensitivity, SaaS vendors, external hosts) and
#    optional demo state.
#
#  HOW IT IS USED (contract)
#    * org-rbac seeds its SQLite tables from it when they are empty, or on
#      `python -m aegis seed --reset` (also run by `make reset`). After seeding,
#      SQLite is the source of truth for members/agents/keys.
#    * `resources:` is re-read at every start and served by rt.org.resources().
#    * `budgets:` amounts are REFERENCE ONLY: the enforced limits live in
#      config/policy.yaml `budgets.limits` (policy-engine ported them). Budget
#      raises are governed policy changes (GOV-05), not edits of this file.
#    * `demo_state:` is read (read-only YAML) by budgets-ledger (counters) and
#      approvals-engine (approval history), never by org-rbac.
#    * Loader mapping (CONTRACTS §4.5): member teams[0] -> team_id; agent
#      sponsor -> owner_member_id, display_name -> name, kind coding_agent ->
#      claude-code / local_agent -> scripted / remote_agent -> sdk / else other,
#      models.allowed -> allowed_models, tools.allow/deny -> allowed_tools/
#      denied_tools, max_destination -> max_destination, profile_override ->
#      profile, data_grants/action_types -> meta.
#
#  CONVENTIONS
#    * ids are stable slugs and BINDING (CONTRACTS §4.5). Humans: `u_<firstname>`.
#      Agents: `<name>@<team>`.
#    * Tool globs use the CONTRACT tool names: built-ins keep Claude Code names
#      (`Bash`, `Read`, ...), MCP tools are `<server>.<tool>` (the loader still
#      accepts and converts the old `mcp__<server>__<tool>` form).
#    * Model globs use WIRE model names (`claude-*`, `aegis-judge*`, `qwen*`,
#      `mock-*`), never provider-prefixed ids.
#    * Money is USD. ALL emails use the reserved `.example` TLD; ALL people are
#      fictional. ALL API keys are FAKE (`aegis_demo_..._NOT_A_SECRET`), safe to
#      commit; only hmac_hex(key, purpose="apikey") is stored.
#
#  FIXES vs. staging/seed/org.seed.yaml (details: CONTRACTS Addendum A, "Seed fixes")
#    [SF-02] tool allowlists in contract form; research-agent may call
#            payments.create_charge and claude-code may call MCP tools (`*.*`), so
#            GOV-03 no longer blocks the $12 / $480 F4 flows before ACT-01 routes them
#    [SF-03] model allowlists as wire globs (aegis-judge*/qwen*/mock-*), so local
#            and mock demo traffic is not blocked by GOV-02
#    [SF-01] still ONE owner on purpose: two-person = owner + a distinct admin
#    [SF-12] API keys valid until 2027-10-31 (tests no longer rot after 4 Oct);
#            expired-key example; disabled agent legacy-bot@platform (GOV-01 tests)
#    [SF-13] demo_state: research-agent local compute starts at 2400 s (not 92 %)
#    [SF-14] resources: canonical entity names, mcp_server mapping, mock hosts
#            (pay.saas.test, crm.saas.test, paste.test, exfil.test) as external hosts
#    [SF-15] Claude Code's agent key travels in X-Aegis-Agent-Key (via
#            ANTHROPIC_CUSTOM_HEADERS); its Authorization header stays its OAuth token
#    [SF-17] demo_state.approval_history uses contract kinds / action types / rule ids
#    [SF-25] control_plane.view_as_aliases + default_viewer (demo role switcher)
# =============================================================================

schema: aegis.org-seed/v1
seed_version: 2026.10.04-2

# -----------------------------------------------------------------------------
