  name: Acme Capital
  legal_name: Acme Capital Sp. z o.o.          # fictional
  description: >
    Mid-size Kraków-based investment firm. Trading desk uses a remote AI copilot,
    Research runs a local-first agent on Ollama, Platform engineers use Claude Code.
    Everything goes through the Aegis gateway.
  timezone: Europe/Warsaw
  currency: USD
  locale: [en-GB, pl-PL]
  email_domain: acme-capital.example
