# -----------------------------------------------------------------------------
# Resources that agent ACTIONS touch (rt.org.resources()).
#   * databases[].environment (prod|staging) + tables[].sensitivity
#     (PUBLIC < INTERNAL < CONFIDENTIAL < RESTRICTED) -> ACT-02 labels env /
#     sensitivity -> approval rules db-*.
#   * vendors[].approved + plans[].usd/recurring -> ACT-01 labels
#     vendor_approved / recurring + catalog price check -> spend-* rules.
#   * external_hosts[] -> ACT-03 / DLP-04 (dest_class, denylisted).
#   * tables[].contains uses CONTRACT entity names (CONTRACTS §3.4).  [SF-14]
#   All databases are served by the mock MCP server `acme-db` (mock_mcp :8792).
# -----------------------------------------------------------------------------
resources:
  databases:
    - id: acme-prod-pg
      engine: postgres
      environment: prod
      mcp_server: acme-db
      tables:
        - name: customers
          sensitivity: CONFIDENTIAL
          categories: [pii]
          contains: [PERSON, EMAIL, PHONE, PESEL, IBAN, ADDRESS, DOB]
          description: Retail and institutional client master data (fictional rows).
        - name: payment_cards
          sensitivity: RESTRICTED
          categories: [pci]
          contains: [PAN, CARD_EXPIRY]
          description: Tokenized card-on-file data. Agents may never read raw PANs.
        - name: trades
          sensitivity: CONFIDENTIAL
          categories: [mnpi]
          contains: []
          description: Executed trades (material non-public information).
        - name: positions
          sensitivity: CONFIDENTIAL
          categories: [mnpi]
          contains: []
        - name: research_notes
          sensitivity: INTERNAL
          categories: []
          contains: []
        - name: market_prices
          sensitivity: PUBLIC
          categories: []
          contains: []

    - id: acme-staging-pg
      engine: postgres
      environment: staging
      mcp_server: acme-db
      schema: staging
      tables:
        - {name: customers_synthetic, sensitivity: INTERNAL, categories: [synthetic], contains: []}
        - {name: trades_synthetic,    sensitivity: INTERNAL, categories: [synthetic], contains: []}
        - {name: market_prices,       sensitivity: PUBLIC,   categories: [],          contains: []}

  # SaaS vendors an agent can buy from (ACT-01 / spend approvals).
  vendors:
    - id: marketpulse
      name: MarketPulse Pro
      category: market_data_saas
      approved: true
      host: api.marketpulse.example
      mcp_server: marketpulse
      plans:
        - {id: mp-pro-monthly, usd: 50.00, recurring: monthly}      # F4: "$50 subscription" -> admin
        - {id: mp-enterprise-annual, usd: 4800.00, recurring: yearly}
    - id: opendata-shop
      name: OpenData Shop
      category: dataset
      approved: true
      host: shop.opendata.example
      plans:
        - {id: eu-equities-2025-csv, usd: 12.00, recurring: none}   # F4: $12 -> sponsor self-approves
    - id: gpucloud
