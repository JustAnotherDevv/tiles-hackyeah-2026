  initial_profile: balanced

# -----------------------------------------------------------------------------
# Roles (organization-level). rank is used for ">= role" comparisons.
# Agents are NOT a role: they are service identities that can REQUEST approvals
# but can NEVER approve anything.
# -----------------------------------------------------------------------------
roles:
  - id: owner
    rank: 30
    description: Ultimate authority. Org-level budgets, spend > $200, prod writes, control disables of critical controls, the owner half of every two-person approval.
  - id: admin
    rank: 20
    description: Runs teams and policy day to day. Team budgets up to 2x, PII data access, spend up to $200, the second approver of a two-person rule.
  - id: member
    rank: 10
    description: Uses AI tools. Can request anything; can approve only `self` rules (their own requests and their sponsored agents').

# -----------------------------------------------------------------------------
# Teams (lead / data_ceiling / default_destination_tier -> Team.meta)
