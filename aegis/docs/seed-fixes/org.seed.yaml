# -----------------------------------------------------------------------------
# Agents (service identities)
#   kind:            coding_agent | local_agent | remote_agent | red_team | legacy
#   sponsor:         accountable human (fills `self` approval slots; never an
#                    admin/owner slot of their agent's own request)
#   models.allowed:  WIRE model globs (GOV-02 intersects with policy models.allowed)
#   max_destination: most-remote destination class this agent may send data to
#                    (local | remote | third_party)
#   tools:           allow/deny globs for GOV-03; deny wins
#   data_grants:     standing (pre-approved) DB access; anything else -> ACT-02
#   action_types:    approval families the agent may even request (informational)
# -----------------------------------------------------------------------------
agents:
  - id: claude-code@platform
    display_name: Claude Code (Platform)
    kind: coding_agent
    team: platform
    sponsor: u_tomasz
    location: local_process            # developer laptop; model calls go remote via the gateway
    description: >
      Claude Code CLI launched with `make claude` (claude --settings
      demo/claude/settings.json --mcp-config demo/claude/mcp.json
      --strict-mcp-config). Model traffic via ANTHROPIC_BASE_URL=http://127.0.0.1:8787,
      tool calls via a fail-closed PreToolUse hook, MCP servers via the Aegis MCP proxy.
    integration:
      model_gateway: anthropic          # /v1/messages ingress
      hooks: [PreToolUse, PostToolUse, UserPromptSubmit, ConfigChange, SessionStart, SessionEnd]
      mcp_proxy: true
      # [SF-15] identity carriers: model path -> header `X-Aegis-Agent-Key: <key>` set via
      # ANTHROPIC_CUSTOM_HEADERS (Authorization stays Claude Code's OAuth token);
      # hooks + MCP -> `Authorization: Bearer <key>`.
      key_header: X-Aegis-Agent-Key
    models:
      default: claude-sonnet-4-5
      allowed: ["claude-*", "aegis-judge*", "qwen*", "mock-*"]     # [SF-03] aegis-judge = downgrade target
    max_destination: remote
    tools:                              # [SF-02]
      allow: [Read, Write, Edit, MultiEdit, Glob, Grep, LS, NotebookEdit, Bash, BashOutput, KillShell,
              TodoWrite, Task, Agent, WebSearch, ExitPlanMode, Skill, SlashCommand, AskUserQuestion,
              "*.*"]                    # every MCP tool (<server>.<tool>); other controls govern them
      deny: ["acme-crm.export_*", WebFetch]                 # WebFetch only via Aegis-proxied web.fetch_url
    data_grants:
      - {database: acme-staging-pg, tables: ["*"], operations: [read, write]}
      - {database: acme-prod-pg, tables: [market_prices, research_notes], operations: [read]}
    action_types: [spend, data_access, external_send, code_exec, deploy]
    status: active

  - id: research-agent@research
    display_name: Research Agent (local)
    kind: local_agent
    team: research
    sponsor: u_agnieszka
    location: local_process
    description: >
      Python agent on the laptop talking to local Ollama only (aegis-judge =
      Qwen3.5 0.8B, fallback qwen3:0.6b). Reads research notes and filings, may
      query the customer table for coverage lists, buys small datasets.
      Local-first: nothing it sees leaves the laptop unless approved.
    integration:
      model_gateway: ollama             # /ollama/api/chat ingress (native, for compute-seconds)
      hooks: []
      mcp_proxy: true
    models:
      default: aegis-judge
      allowed: ["aegis-judge*", "qwen*", "hf.co/*"]          # [SF-03] was ollama/qwen3.5:0.8b
    max_destination: local             # local only; remote/third-party egress -> GOV-02 / ACT-03
    tools:                              # [SF-02] + payments.create_charge for the $12 dataset (F4)
      allow: ["acme-db.*", "filesystem.read_*", "marketpulse.*", "payments.create_charge", "web.fetch_url", "weather.*"]
      deny: ["*.send_*", "mailer.*"]
    data_grants:
      - {database: acme-prod-pg, tables: [research_notes, market_prices], operations: [read]}
    action_types: [spend, data_access]
    status: active

  - id: trading-copilot@trading
    display_name: Trading Copilot (remote)
    kind: remote_agent
    team: trading
    sponsor: u_piotr
    location: remote_saas              # agent logic hosted remotely; calls home through Aegis
    description: >
      Desk copilot on a remote model (Anthropic or OpenRouter if keys exist,
      otherwise the mock LLM `mock-echo`). Drafts client emails, looks up
      positions, subscribes to data feeds. Client PII is tokenized before it leaves.
    integration:
      model_gateway: openai             # OpenAI-compatible /v1/chat/completions ingress
      hooks: []
      mcp_proxy: true
    models:
      default: mock-echo
      # [SF-03] no gpt-4.1-mini and no claude-opus-* on purpose (GOV-02 demo blocks)
      allowed: ["claude-haiku-*", "claude-sonnet-*", "meta-llama/*", "aegis-judge*", "qwen*", "mock-*"]
    max_destination: remote
    tools:                              # [SF-02]
      allow: ["acme-crm.lookup_*", "acme-db.*", "marketpulse.*", "mailer.send_email", "payments.create_charge", "web.fetch_url"]
      deny: ["acme-crm.delete_*", "trade.execute"]          # it may DRAFT trades, never execute
    data_grants:
      - {database: acme-prod-pg, tables: [market_prices, positions], operations: [read]}
    action_types: [spend, data_access, external_send]
    status: active

  - id: chaos-agent@platform
    display_name: Chaos Agent (red team)
    kind: red_team
    team: platform
    sponsor: u_tomasz
    location: local_process
    description: >
      Scripted adversarial agent used in demos and the self-test suite:
      prompt injection, PII exfiltration, runaway loops, $5k purchase attempts,
      poisoned MCP servers, prod DROP TABLE. Tight budgets so it trips fast.
      It is a normal identity - Aegis gives it no special treatment.
    integration:
      model_gateway: openai
      hooks: []
      mcp_proxy: true
    models:
      default: mock-echo
      allowed: ["aegis-judge*", "qwen*", "claude-haiku-*", "mock-*"]   # [SF-03]
    max_destination: remote
    tools:
      allow: ["*"]                       # deliberately broad: every other control has to catch it
      deny: []
    data_grants: []
    action_types: [spend, data_access, external_send, code_exec, deploy]
    profile_override: null               # set to `strict` to show per-agent profiles (informational in this build)
    demo: true
    status: active

  - id: legacy-bot@platform              # [SF-12] disabled principal for GOV-01 must-block tests
    display_name: Legacy Bot (retired)
    kind: legacy
    team: platform
    sponsor: u_marek
    location: remote_saas
    description: Retired after a vendor ToS change. Any traffic from it must be blocked by GOV-01.
    integration: {model_gateway: openai, hooks: [], mcp_proxy: false}
    models:
      default: mock-echo
      allowed: ["mock-*"]
    max_destination: remote
    tools: {allow: [], deny: ["*"]}
    data_grants: []
    action_types: []
    status: disabled

