<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis Control Layer</title>
  <meta name="description" content="Aegis — AI Control Layer dashboard prototype (visual language reference for the React + shadcn build).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236D5DFC'/%3E%3Cpath d='M12 4.5 6.5 6.6v4.5c0 3.4 2.3 6.1 5.5 7.4 3.2-1.3 5.5-4 5.5-7.4V6.6L12 4.5Z' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <div>
          <div class="brand-name">Aegis</div>
          <div class="brand-sub">AI Control Layer</div>
        </div>
      </div>
      <button class="org-switch" type="button" data-tip="Organization · environment">
        <span class="org-logo">AC</span>
        <span class="org-meta grow">
          <span class="org-name" style="display:block">Acme Capital</span>
          <span class="org-env"><span class="status-dot ok"></span>Production · eu-central</span>
        </span>
        <span class="t3 org-meta" id="org-chev"></span>
      </button>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="btn ghost icon" id="menu-btn" type="button" aria-label="Open navigation"></button>
        <div class="crumbs"><span>Acme Capital</span><span class="t4">/</span><b id="crumb">Command Center</b></div>
        <div class="spacer"></div>
        <button class="search-btn" id="search-btn" type="button"><span id="search-ico"></span><span>Search or jump to…</span><span class="kbd">⌘K</span></button>
        <span class="version-pill" id="version-pill" data-tip="Every decision is stamped with the active catalog + feed version"></span>
        <button class="btn danger-ghost sm" id="kill-btn" type="button"></button>
        <div class="vsep"></div>
        <div class="view-as">
          <span class="view-as-label">View as</span>
          <div id="role-seg"></div>
          <div class="me" id="me"></div>
        </div>
      </header>
      <div class="killbar" id="killbar"></div>
      <div class="content" id="content">
        <main class="page" id="view" tabindex="-1"></main>
      </div>
    </div>
  </div>

  <noscript><div style="padding:24px;color:#ECEEF1">This prototype needs JavaScript.</div></noscript>

  <script src="assets/data.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/view-overview.js"></script>
  <script src="assets/view-live.js"></script>
  <script src="assets/view-redaction.js"></script>
  <script src="assets/view-approvals.js"></script>
  <script src="assets/view-budgets.js"></script>
  <script src="assets/view-policy.js"></script>
  <script src="assets/view-feed.js"></script>
  <script src="assets/view-org.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
