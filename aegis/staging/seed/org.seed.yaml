# =============================================================================
#  Aegis - demo organization seed: "Acme Capital"
# =============================================================================
#
#  WHAT THIS FILE IS
#    The initial state of the demo organization: who the humans are, which
#    AI agents exist (as service identities), their API keys, the team
#    budgets, and the inventory of resources that agent actions touch
#    (databases/tables with sensitivity, SaaS vendors, external hosts).
#
#  HOW IT IS USED
#    * Loaded once into SQLite on first boot, or on `aegis seed --reset`
#      (also called by `make demo-preflight`).
#    * After seeding, the SQLite tables are the source of truth for org data.
#      Budgets in particular change through APPROVED `config_change.budget_increase`
#      requests (see approvals.yaml); they are not edited here at runtime.
#    * policy.yaml can still override any budget live via
#      `budgets.limit_overrides` (judge lever). Precedence:
#        policy.yaml limit_overrides  >  SQLite (seeded from here, changed by approvals)
#
#  RELATION TO THE OTHER SEED FILES
#    org.seed.yaml   -> WHO and WHAT (identities, teams, budgets, resources)
#    policy.yaml     -> HOW traffic is governed (controls, profiles, budgets rules)
#    approvals.yaml  -> WHO MAY APPROVE WHAT (approval matrix)
#    SCENARIOS.md    -> 12 demo walkthroughs tying the three together
#
#  CONVENTIONS
#    * ids are stable slugs. Humans: `u_<firstname>`. Agents: `<name>@<team>`.
#    * Money is USD. `tokens` = input + output tokens (the ledger may split them).
#    * `local_compute_s` = Ollama load + prompt_eval + eval seconds (ns / 1e9),
#      priced with a shadow price from policy.yaml `budgets.cost_table`.
#    * Budget windows are calendar windows in the org timezone
#      (daily resets 00:00 Europe/Warsaw, monthly on the 1st).
#    * ALL emails use the reserved `.example` TLD. ALL people are fictional.
#    * ALL API keys are FAKE demo values: prefix `aegis_demo_`, low entropy,
#      suffix `_NOT_A_SECRET`. They are safe to commit. A real deployment would
#      store only `key_hmac` (HMAC-SHA256 with a server-side pepper) and show
#      the plaintext exactly once at creation.
#
#  NOTE FOR THE IMPLEMENTER
#    Field names here are proposals. CONTRACTS.md is authoritative; adapt names
#    to the final schema but keep the semantics (sponsor, scope, sensitivity...).
# =============================================================================

schema: aegis.org-seed/v1
seed_version: 2026.10.04-1

# -----------------------------------------------------------------------------
# Organization
# -----------------------------------------------------------------------------
org:
  id: acme-capital
  name: Acme Capital
  legal_name: Acme Capital Sp. z o.o.          # fictional
  description: >
    Mid-size Kraków-based investment firm. Trading desk uses a remote AI copilot,
    Research runs a local-first agent on Ollama, Platform engineers use Claude Code.
    Everything goes through the Aegis gateway.
  timezone: Europe/Warsaw
  currency: USD
  locale: [en-GB, pl-PL]
  email_domain: acme-capital.example
  internal_domains: [acme-capital.example, corp.acme-capital.example]  # used by DLP-03 / ACT-03
  # Which policy file + profile the org starts on. The profile itself lives in
  # policy.yaml (`profile:`); this is only the value written at seed time.
  policy_ref: policy.yaml
  initial_profile: balanced

# -----------------------------------------------------------------------------
# Roles (organization-level). Approval routing in approvals.yaml uses these.
#   rank is used for ">= role" comparisons: an owner can fill an admin slot,
#   an admin can fill a self slot (when allowed), never the other way round.
# -----------------------------------------------------------------------------
roles:
  - id: owner
    rank: 30
    description: Ultimate authority. Org-level budgets, high-value spend, prod writes, two-person co-signer.
  - id: admin
    rank: 20
    description: Runs teams and policy day to day. Team budgets up to 2x, PII data access, mid-value spend.
  - id: member
    rank: 10
    description: Uses AI tools. Can request anything; can self-approve only rules marked `self`.
  # Agents are NOT a role. They are service identities (see `agents:` below):
  # they can REQUEST approvals but can NEVER approve anything.

# -----------------------------------------------------------------------------
# Teams
#   lead: the admin who sees this team's queue first (any admin may still act,
#   unless approvals.yaml says `same_team_required: true`).
#   data_ceiling: highest data class the team's agents may ever touch without
#   an approval (checked by ACT-02 together with table sensitivity).
# -----------------------------------------------------------------------------
teams:
  - id: trading
    name: Trading
    description: Equities and FX desk. Remote AI copilot, market-data SaaS, client comms.
    lead: u_emily
    data_ceiling: CONFIDENTIAL
    default_destination_tier: T1        # remote models allowed (with tokenization)
    color: "#f59e0b"

  - id: research
    name: Research
    description: Equity research. Local-first - prefers Ollama so client data never leaves the laptop.
    lead: u_emily                        # small org: Trading head also covers Research
    data_ceiling: CONFIDENTIAL
    default_destination_tier: T0        # local only by default
    color: "#10b981"

  - id: platform
    name: Platform
    description: Internal engineering, infra and the AI platform itself (runs Aegis).
    lead: u_marek
    data_ceiling: INTERNAL
    default_destination_tier: T1
    color: "#3b82f6"

