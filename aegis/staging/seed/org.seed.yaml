# -----------------------------------------------------------------------------
# Budgets (amounts). The RULES (soft thresholds, downgrade ladder, cost table,
# loop limits) live in policy.yaml `budgets:` / BUD-01 / BUD-02 / EXE-04.
#
# Hierarchy: org -> team -> agent -> session. A request must fit EVERY level.
# Teams may oversubscribe the org (sum of team caps > org cap is allowed);
# the org cap is still the hard ceiling.
# -----------------------------------------------------------------------------
budgets:
  org:
    usd:             {daily: 150.00,   monthly: 3000.00}
    tokens:          {daily: 12000000, monthly: 240000000}
    local_compute_s: {daily: 14400,    monthly: 300000}     # 4 h/day of Ollama time

  teams:
    trading:
      usd:             {daily: 60.00,   monthly: 1200.00}
      tokens:          {daily: 4000000, monthly: 80000000}
      local_compute_s: {daily: 1800,    monthly: 36000}
    research:                                              # local-first: low USD, high compute
      usd:             {daily: 15.00,   monthly: 300.00}
      tokens:          {daily: 1500000, monthly: 30000000}
      local_compute_s: {daily: 7200,    monthly: 150000}
    platform:
      usd:             {daily: 50.00,   monthly: 1000.00}
      tokens:          {daily: 6000000, monthly: 120000000}
      local_compute_s: {daily: 3600,    monthly: 72000}

  agents:
    claude-code@platform:
      usd:             {daily: 30.00}
      tokens:          {daily: 5000000}
      session:         {usd: 5.00, tokens: 3000000, steps: 300, tool_calls: 400, wall_s: 7200}
      max_parallel: 4
    research-agent@research:
      usd:             {daily: 2.00}                       # shadow-priced local compute only
      local_compute_s: {daily: 5400}
      session:         {local_compute_s: 600, steps: 40, tool_calls: 30, wall_s: 900}
      max_concurrent_local: 1                              # 8 GB laptop: one inference at a time
    trading-copilot@trading:
      usd:             {daily: 20.00}
      tokens:          {daily: 1500000}
      session:         {usd: 1.00, tokens: 200000, steps: 30, tool_calls: 20, wall_s: 600}
    chaos-agent@platform:                                  # tiny on purpose: trips in seconds
      usd:             {daily: 0.50}
      tokens:          {daily: 100000}
      local_compute_s: {daily: 120}
      session:         {usd: 0.10, tokens: 20000, steps: 15, tool_calls: 10, wall_s: 120}

  # Members' own direct usage (playground, CLI) - optional, defaults if absent.
  member_defaults:
    usd: {daily: 5.00}
    tokens: {daily: 500000}

# -----------------------------------------------------------------------------
# Resources that agent ACTIONS touch. Approval routing uses these attributes:
#   * database.environment (prod|staging) and table.sensitivity
#     (PUBLIC < INTERNAL < CONFIDENTIAL < RESTRICTED, same scale as policy.yaml
#     data_classes) drive ACT-02 / APR-DATA-* rules.
#   * vendor.approved and plan price drive ACT-01 / APR-SPEND-* rules.
#   * external host tier drives ACT-03 / APR-SEND-* rules.
# Mocks run on ports 8791-8799 (suggested mapping; CONTRACTS.md is authoritative).
# -----------------------------------------------------------------------------
resources:
  databases:
    - id: acme-prod-pg
      engine: postgres
      environment: prod
      mock: {service: mock_db, port: 8794}
      tables:
        - name: customers
          sensitivity: CONFIDENTIAL
          categories: [pii]
          contains: [PERSON, EMAIL, PHONE, PL_PESEL, IBAN, POSTAL_ADDRESS, DATE_OF_BIRTH]
          description: Retail and institutional client master data (fictional rows).
        - name: payment_cards
          sensitivity: RESTRICTED
          categories: [pci]
          contains: [CREDIT_CARD, CARD_EXPIRY]
          description: Tokenized card-on-file data. Agents may never read raw PANs.
        - name: trades
          sensitivity: CONFIDENTIAL
          categories: [mnpi]
          description: Executed trades (material non-public information).
        - name: positions
          sensitivity: CONFIDENTIAL
          categories: [mnpi]
        - name: research_notes
          sensitivity: INTERNAL
          categories: []
        - name: market_prices
          sensitivity: PUBLIC
          categories: []

    - id: acme-staging-pg
      engine: postgres
      environment: staging
      mock: {service: mock_db, port: 8794, schema: staging}
      tables:
        - {name: customers_synthetic, sensitivity: INTERNAL, categories: [synthetic]}
        - {name: trades_synthetic,    sensitivity: INTERNAL, categories: [synthetic]}
        - {name: market_prices,       sensitivity: PUBLIC,   categories: []}

  # SaaS vendors an agent can buy from (ACT-01 / spend approvals).
  vendors:
    - id: marketpulse
      name: MarketPulse Pro
      category: market_data_saas
      approved: true                      # on the approved-vendor list
      host: api.marketpulse.example
      plans:
        - {id: mp-pro-monthly, usd: 50.00, recurring: monthly}   # the "$50 subscription" scenario
        - {id: mp-enterprise-annual, usd: 4800.00, recurring: yearly}
    - id: opendata-shop
      name: OpenData Shop
      category: dataset
      approved: true
      host: shop.opendata.example
      plans:
        - {id: eu-equities-2025-csv, usd: 12.00, recurring: none}  # the self-approve scenario
    - id: gpucloud
      name: BurstGPU Cloud
      category: compute
      approved: true
      host: api.burstgpu.example
      plans:
        - {id: a100-24h-reservation, usd: 480.00, recurring: none} # the owner scenario
    - id: shady-signals
      name: Shady Signals Ltd
      category: market_data_saas
      approved: false                     # unknown vendor -> stricter routing in strict profile
      host: signals.shady.example
      plans:
        - {id: alpha-signals, usd: 15.00, recurring: monthly}

  # Outbound destinations for ACT-03 (external send) and DLP-04/06 allowlists.
  external_hosts:
    - {host: smtp.acme-capital.example,  tier: T0, purpose: internal mail relay}
    - {host: api.marketpulse.example,    tier: T2, purpose: market data SaaS (approved vendor)}
    - {host: hooks.slack.example,        tier: T2, purpose: team chat webhook}
    - {host: client-portal.example,      tier: T2, purpose: external client portal}
    - {host: paste.exfil.example,        tier: T2, purpose: "known-bad sink used by chaos-agent (mock :8793)", denylisted: true}

  # Model hosts are declared in policy.yaml `models:` (tiers T0/T1).

