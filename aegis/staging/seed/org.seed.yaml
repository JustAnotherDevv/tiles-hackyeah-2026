# -----------------------------------------------------------------------------
# Agents (service identities)
#   kind:          coding_agent | local_agent | remote_agent | red_team
#   location:      where the agent process runs (for the architecture view)
#   sponsor:       accountable human (fills `self` approval slots)
#   models:        allowlist enforced by GOV-02 (policy.yaml has the model registry
#                  with tiers T0/T1; ids must exist there)
#   max_destination_tier: highest trust tier this agent may send data to
#                  (T0 local/internal, T1 approved remote model, T2 third party)
#   tools:         allow/deny globs enforced by GOV-03 (Claude Code tool names,
#                  MCP tools as mcp__<server>__<tool>, HTTP tools as http.<verb>)
#   data_grants:   standing (pre-approved) DB access. Anything beyond -> ACT-02
#                  raises an approval request routed by approvals.yaml.
#   action_types:  which agent_action approval types this agent may even REQUEST
#                  (anything else is blocked outright by GOV-03).
#   profile_override: optional per-agent strictness profile (policy.yaml).
# -----------------------------------------------------------------------------
agents:
  - id: claude-code@platform
    display_name: Claude Code (Platform)
    kind: coding_agent
    team: platform
    sponsor: u_tomasz
    location: local_process            # developer laptop; model calls go remote via the gateway
    description: >
      Claude Code CLI launched with `claude --settings demo/claude-settings.json`.
      Model traffic via ANTHROPIC_BASE_URL=http://127.0.0.1:8787, tool calls via a
      fail-closed PreToolUse hook, MCP servers via the Aegis MCP proxy.
    integration:
      model_gateway: anthropic          # /v1/messages ingress
      hooks: [PreToolUse, PostToolUse, UserPromptSubmit]
      mcp_proxy: true
    models:
      default: anthropic/claude-sonnet-5-5
      allowed:
        - anthropic/claude-opus-5-5
        - anthropic/claude-sonnet-5-5
        - anthropic/claude-haiku-4-5     # Claude Code uses a small model for background tasks
        - ollama/qwen3.5:0.8b            # downgrade target when budget is tight
    max_destination_tier: T1
    tools:
      allow: [Read, Glob, Grep, Edit, Write, Bash, TodoWrite, "mcp__filesystem__*", "mcp__acme-crm__lookup_*", "mcp__acme-db__query"]
      deny: ["mcp__acme-crm__export_*", WebFetch]        # WebFetch only via http tools proxied by Aegis
    data_grants:
      - {database: acme-staging-pg, tables: ["*"], operations: [read, write]}
      - {database: acme-prod-pg, tables: [market_prices, research_notes], operations: [read]}
    action_types: [spend, data_access, external_send, code_exec, deploy]
    status: active

  - id: research-agent@research
    display_name: Research Agent (local)
    kind: local_agent
    team: research
    sponsor: u_agnieszka
    location: local_process
    description: >
      Python agent on the laptop talking to local Ollama only (Qwen3.5 0.8B).
      Reads research notes and filings, may query the customer table for
      coverage lists. Local-first: nothing it sees leaves T0 unless approved.
    integration:
      model_gateway: ollama             # /api/chat ingress (native, for compute-seconds)
      hooks: []
      mcp_proxy: true
    models:
      default: ollama/qwen3.5:0.8b
      allowed: [ollama/qwen3.5:0.8b]
    max_destination_tier: T0           # local only; any T1/T2 egress -> blocked by GOV-02 / ACT-03
    tools:
      allow: ["mcp__acme-db__query", "mcp__filesystem__read_*", "http.get:*.acme-capital.example", "mcp__marketpulse__get_quote"]
      deny: ["http.post:*", "mcp__*__send_*"]
    data_grants:
      - {database: acme-prod-pg, tables: [research_notes, market_prices], operations: [read]}
    action_types: [spend, data_access]
    status: active

  - id: trading-copilot@trading
    display_name: Trading Copilot (remote)
    kind: remote_agent
    team: trading
    sponsor: u_piotr
    location: remote_saas              # agent logic hosted remotely; calls home through Aegis
    description: >
      Desk copilot on a remote model (Anthropic or OpenRouter if keys exist,
      otherwise the mock LLM). Drafts client emails, looks up positions,
      subscribes to data feeds. Client PII is tokenized before it leaves.
    integration:
      model_gateway: openai             # OpenAI-compatible /v1/chat/completions ingress
      hooks: []
      mcp_proxy: true
    models:
      default: anthropic/claude-haiku-4-5
      allowed:
        - anthropic/claude-haiku-4-5
        - anthropic/claude-sonnet-5-5
        - openrouter/meta-llama/llama-3.3-70b-instruct
        - ollama/qwen3.5:0.8b            # downgrade target
    max_destination_tier: T1
    tools:
      allow: ["mcp__acme-crm__lookup_*", "mcp__acme-db__query", "mcp__marketpulse__*", "mcp__mailer__send_email", "saas.purchase_subscription", "http.get:*"]
      deny: ["mcp__acme-crm__delete_*", "trade.execute"]   # it may DRAFT trades, never execute
    data_grants:
      - {database: acme-prod-pg, tables: [market_prices, positions], operations: [read]}
    action_types: [spend, data_access, external_send]
    status: active

  - id: chaos-agent@platform
    display_name: Chaos Agent (red team)
    kind: red_team
    team: platform
    sponsor: u_tomasz
    location: local_process
    description: >
      Scripted adversarial agent used in demos and the self-test suite:
      prompt injection, PII exfiltration, runaway loops, $5k purchase attempts,
      poisoned MCP servers, prod DROP TABLE. Tight budgets so it trips fast.
      It is a normal identity - Aegis gives it no special treatment.
    integration:
      model_gateway: openai
      hooks: []
      mcp_proxy: true
    models:
      default: ollama/qwen3.5:0.8b
      allowed: [ollama/qwen3.5:0.8b, anthropic/claude-haiku-4-5]
    max_destination_tier: T1
    tools:
      allow: ["*"]                       # deliberately broad: every other control has to catch it
      deny: []
    data_grants: []
    action_types: [spend, data_access, external_send, code_exec, deploy]
    profile_override: null               # set to `strict` to show per-agent profiles
    demo: true
    status: active

