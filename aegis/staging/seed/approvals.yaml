    expect: {level: owner+admin, rule: APR-DEPLOY-PROD-STRICT}

  # --- budgets ---------------------------------------------------------------
  - name: team-monthly-raise-under-2x-admin
    request: {type: config_change.budget_increase, requester: u_piotr, params: {scope_type: team, scope_id: team/trading, dimension: usd, window: monthly, current_value: 1200, requested_value: 2000}}
    expect: {level: admin, rule: APR-BUDGET-TEAM-2X, computed: {factor: 1.667}, approvers_ok: [u_emily, u_marek, u_katarzyna], approvers_not_ok: [u_piotr]}
  - name: team-monthly-raise-exactly-2x-admin
    request: {type: config_change.budget_increase, requester: u_agnieszka, params: {scope_type: team, scope_id: team/research, dimension: usd, window: monthly, current_value: 300, requested_value: 600}}
    expect: {level: admin, rule: APR-BUDGET-TEAM-2X}
  - name: team-monthly-raise-over-2x-owner
    request: {type: config_change.budget_increase, requester: u_agnieszka, params: {scope_type: team, scope_id: team/research, dimension: usd, window: monthly, current_value: 300, requested_value: 900}}
    expect: {level: owner, rule: APR-BUDGET-TEAM-OVER-2X, approvers_ok: [u_katarzyna], approvers_not_ok: [u_emily]}
  - name: org-budget-raise-owner
    request: {type: config_change.budget_increase, requester: u_marek, params: {scope_type: org, scope_id: org, dimension: usd, window: daily, current_value: 150, requested_value: 200}}
    expect: {level: owner, rule: APR-BUDGET-ORG, approvers_ok: [u_katarzyna], approvers_not_ok: [u_marek]}
  - name: org-budget-raise-by-sole-owner
    request: {type: config_change.budget_increase, requester: u_katarzyna, params: {scope_type: org, scope_id: org, dimension: usd, window: monthly, current_value: 3000, requested_value: 4000}}
    expect: {level: owner, rule: APR-BUDGET-ORG, fallback: requester_owner_plus_admin, approvers_ok: [[u_katarzyna, u_marek], [u_katarzyna, u_emily]]}

  # --- controls --------------------------------------------------------------
  - name: disable-control-strict-two-person
    profile: strict
    request: {type: config_change.control_disable, requester: u_marek, params: {control_id: INJ-02, change: disable, control_severity: high, profile: strict, justification: "False positives on Polish research notes."}}
