  - name: disable-control-balanced-admin
    profile: balanced
    request: {type: config_change.control_disable, requester: u_marek, params: {control_id: INJ-03, change: disable, control_severity: medium, profile: balanced, justification: "Tuning adherence purpose texts."}}
    expect: {level: admin, rule: APR-CTRL-BALANCED, approvers_ok: [u_emily, u_katarzyna], approvers_not_ok: [u_marek], effect: {auto_revert_after: 4h}}
  - name: disable-critical-balanced-owner
    profile: balanced
    request: {type: config_change.control_disable, requester: u_emily, params: {control_id: DLP-02, change: disable, control_severity: critical, profile: balanced, justification: "Test"}}
    expect: {level: owner, rule: APR-CTRL-BALANCED-CRITICAL}
  - name: enable-control-auto
    request: {type: config_change.control_disable, requester: u_olivia, params: {control_id: INJ-03, change: enable, control_severity: medium}}
    expect: {level: auto, rule: APR-CTRL-ENABLE}

  # --- models / policy / kill switch -----------------------------------------
  - name: allow-known-provider-remote-model-admin
    request: {type: config_change.model_allow, requester: u_olivia, params: {model_id: anthropic/claude-opus-5-5, model_tier: T1, target_scope: agent, provider_new: false}}
    expect: {level: admin, rule: APR-MODEL-REMOTE}
  - name: allow-new-provider-owner
    request: {type: config_change.model_allow, requester: u_olivia, params: {model_id: openai/gpt-4.1-mini, model_tier: T1, target_scope: agent, provider_new: true}}
